name: Mobile Showcase Screenshots

on:
  workflow_call:
    inputs:
      platform:
        required: true
        type: string
      appearance:
        type: string
        default: dark
      theme:
        type: string
        default: supaterm
      source_sha:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      platform:
        description: Device platforms to capture
        required: true
        default: all
        type: choice
        options:
          - all
          - ios
          - android
      appearance:
        description: System appearances to capture
        required: true
        default: both
        type: choice
        options:
          - both
          - dark
          - light
      theme:
        description: Palette to capture (all multiplies the run by the palette count)
        required: true
        default: supaterm
        type: choice
        options:
          - supaterm
          - supaterm-chat
          - grove
          - ocean
          - ember
          - iris
          - zenbones
          - all

permissions:
  contents: read

env:
  NODE_OPTIONS: --max-old-space-size=8192
  SHOWCASE_APPEARANCE: ${{ inputs.appearance }}
  SHOWCASE_THEME: ${{ inputs.theme }}

jobs:
  # Every job runs the harness from source_sha, which can predate this file, so
  # steps use only harness flags and local actions that older commits have.
  ios-build:
    name: Build iOS showcase app
    if: inputs.platform == 'all' || inputs.platform == 'ios'
    runs-on: xcode-27
    timeout-minutes: 60
    # The fingerprint evaluates app.config.ts, so it must see the build's environment.
    env:
      APP_VARIANT: production
      MOBILE_VERSION_POLICY: appVersion
      EXPO_NO_GIT_STATUS: "1"
      SUPATERM_SHOWCASE_CAPTURE_BUILD: "1"
      NODE_ENV: development
    outputs:
      devices: ${{ steps.devices.outputs.devices }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: ${{ inputs.source_sha || github.sha }}

      - name: Setup Mise
        uses: ./.github/actions/setup-mise
      - name: Select Xcode 27.1
        env:
          DEVELOPER_DIR: /Applications/Xcode_27.1.app/Contents/Developer
        run: |
          xcodebuild -version
          xcrun --find actool
          echo "DEVELOPER_DIR=$DEVELOPER_DIR" >> "$GITHUB_ENV"
      - name: Install workspace dependencies
        run: |
          mise exec -- pnpm config set virtualStoreType project --location project
          mise exec -- vp install --filter=@supaterm/mobile... --filter=@supaterm/scripts... --filter=supaterm...
      - name: Expose pnpm
        run: mise exec -- pnpm --version

      - id: devices
        name: List iOS showcase devices
        run: |
          devices="$(node --input-type=module -e 'import config from "./scripts/mobile-showcase.config.ts"; console.log(JSON.stringify(config.devices.filter((device) => device.platform === "ios").map((device) => device.id)));')"
          echo "devices=$devices" >> "$GITHUB_OUTPUT"

      # The Debug build loads its JavaScript from Metro, so the native fingerprint identifies the binary.
      - id: fingerprint
        name: Resolve iOS showcase fingerprint
        working-directory: apps/mobile
        run: |
          hash="$(node --eval 'require("expo/fingerprint").createFingerprintAsync(process.cwd(), { platforms: ["ios"], silent: true }).then((fingerprint) => console.log(fingerprint.hash))')"
          echo "hash=$hash" >> "$GITHUB_OUTPUT"
      - id: cached-app
        name: Restore iOS showcase app
        uses: actions/cache/restore@v6
        with:
          path: ${{ runner.temp }}/ios-showcase-app.tar
          key: ios-showcase-app-${{ runner.arch }}-xcode-27.1-${{ steps.fingerprint.outputs.hash }}

      - name: Build iOS showcase app
        if: steps.cached-app.outputs.cache-hit != 'true'
        working-directory: apps/mobile
        run: |
          pnpm exec expo prebuild --clean --platform ios
          xcodebuild -workspace ios/Supaterm.xcworkspace -scheme Supaterm -configuration Debug \
            -sdk iphonesimulator -derivedDataPath .showcase/ios-derived-data -quiet \
            "ARCHS=$(uname -m)" ONLY_ACTIVE_ARCH=YES build

      # Artifact zips drop the executable bit, so the bundle travels as a tarball.
      - name: Package iOS showcase app
        if: steps.cached-app.outputs.cache-hit != 'true'
        run: tar -C apps/mobile/.showcase/ios-derived-data/Build/Products/Debug-iphonesimulator -cf "$RUNNER_TEMP/ios-showcase-app.tar" Supaterm.app
      - name: Save iOS showcase app
        if: steps.cached-app.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ${{ runner.temp }}/ios-showcase-app.tar
          key: ${{ steps.cached-app.outputs.cache-primary-key }}

      - name: Upload iOS showcase app
        uses: actions/upload-artifact@v7
        with:
          name: ios-showcase-app
          path: ${{ runner.temp }}/ios-showcase-app.tar
          if-no-files-found: error
          retention-days: 14
          overwrite: true

  # One simulator per runner: a fresh simulator's first boot takes minutes, and
  # keeping several booted on one runner starved later launches into timeouts.
  ios:
    name: iOS ${{ matrix.device }}
    needs: ios-build
    runs-on: xcode-27
    timeout-minutes: ${{ inputs.theme == 'all' && 180 || 60 }}
    strategy:
      fail-fast: false
      matrix:
        device: ${{ fromJSON(needs.ios-build.outputs.devices) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: ${{ inputs.source_sha || github.sha }}

      - name: Setup Mise
        uses: ./.github/actions/setup-mise
      - name: Select Xcode 27.1
        env:
          DEVELOPER_DIR: /Applications/Xcode_27.1.app/Contents/Developer
        run: |
          xcodebuild -version
          xcrun --find actool
          echo "DEVELOPER_DIR=$DEVELOPER_DIR" >> "$GITHUB_ENV"
      - name: Install workspace dependencies
        run: |
          mise exec -- pnpm config set virtualStoreType project --location project
          mise exec -- vp install --filter=@supaterm/mobile... --filter=@supaterm/scripts... --filter=supaterm...
      - name: Expose pnpm
        run: mise exec -- pnpm --version

      - name: Expose foldable simulator controls
        run: echo "AGENT_DEVICE_PATH=$PWD/scripts/node_modules/.bin/agent-device" >> "$GITHUB_ENV"

      - name: Download iOS showcase app
        uses: actions/download-artifact@v8
        with:
          name: ios-showcase-app
          path: ${{ runner.temp }}

      - name: Unpack iOS showcase app
        run: |
          products=apps/mobile/.showcase/ios-derived-data/Build/Products/Debug-iphonesimulator
          mkdir -p "$products"
          tar -C "$products" -xf "$RUNNER_TEMP/ios-showcase-app.tar"

      - name: Capture iOS showcase
        env:
          SHOWCASE_DEVICE: ${{ matrix.device }}
        run: pnpm screenshots:mobile --platform ios --appearance "$SHOWCASE_APPEARANCE" --theme "$SHOWCASE_THEME" --device "$SHOWCASE_DEVICE" --skip-build

      - name: Upload iOS screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: app-store-connect-screenshots-${{ matrix.device }}
          path: artifacts/app-store/screenshots/apple/
          if-no-files-found: warn
          retention-days: 14
          overwrite: true

      - name: Upload raw iOS captures
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: app-store-connect-captures-${{ matrix.device }}
          path: artifacts/app-store/captures/apple/
          if-no-files-found: warn
          retention-days: 14
          overwrite: true

  ios-screenshots:
    name: Collect App Store Connect screenshots
    needs: ios
    runs-on: depot-ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Download iOS screenshots
        uses: actions/download-artifact@v8
        with:
          pattern: app-store-connect-screenshots-*
          merge-multiple: true
          path: apple

      - name: Upload iOS screenshots
        uses: actions/upload-artifact@v7
        with:
          name: app-store-connect-screenshots
          path: apple/
          if-no-files-found: error
          retention-days: 14
          overwrite: true

      - name: Download raw iOS captures
        uses: actions/download-artifact@v8
        with:
          pattern: app-store-connect-captures-*
          merge-multiple: true
          path: captures

      # Source commits from before raw captures existed upload none.
      - name: Upload raw iOS captures
        uses: actions/upload-artifact@v7
        with:
          name: app-store-connect-captures
          path: captures/
          if-no-files-found: warn
          retention-days: 14
          overwrite: true

  android:
    name: Android phone, 7-inch tablet, and 10-inch tablet
    if: inputs.platform == 'all' || inputs.platform == 'android'
    runs-on: ubuntu-24.04
    # Capturing every palette multiplies the device matrix, and only the one
    # native build is shared between them.
    timeout-minutes: ${{ inputs.theme == 'all' && 350 || 120 }}
    env:
      SUPATERM_SHOWCASE_ANDROID_ABI: x86_64
      # The fingerprint evaluates app.config.ts, so it must see the build's environment.
      APP_VARIANT: production
      EXPO_NO_GIT_STATUS: "1"
      SUPATERM_SHOWCASE_CAPTURE_BUILD: "1"
      NODE_ENV: development
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: ${{ inputs.source_sha || github.sha }}

      - name: Setup Mise
        uses: ./.github/actions/setup-mise
      - name: Install workspace dependencies
        run: |
          mise exec -- pnpm config set virtualStoreType project --location project
          mise exec -- vp install --filter=@supaterm/mobile... --filter=@supaterm/scripts... --filter=supaterm...
      - name: Expose pnpm
        run: mise exec -- pnpm --version

      - id: fingerprint
        name: Resolve Android showcase fingerprint
        working-directory: apps/mobile
        run: |
          hash="$(node --eval 'require("expo/fingerprint").createFingerprintAsync(process.cwd(), { platforms: ["android"], silent: true }).then((fingerprint) => console.log(fingerprint.hash))')"
          echo "hash=$hash" >> "$GITHUB_OUTPUT"
      - id: cached-apk
        name: Restore Android showcase APK
        uses: actions/cache/restore@v6
        with:
          path: apps/mobile/android/app/build/outputs/apk/debug/app-debug.apk
          key: android-showcase-apk-${{ env.SUPATERM_SHOWCASE_ANDROID_ABI }}-${{ steps.fingerprint.outputs.hash }}

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle cache
        if: steps.cached-apk.outputs.cache-hit != 'true'
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Build Android showcase APK
        if: steps.cached-apk.outputs.cache-hit != 'true'
        working-directory: apps/mobile
        env:
          GRADLE_OPTS: -Dorg.gradle.daemon=false -Dorg.gradle.workers.max=2
        run: |
          free -m
          pnpm exec expo prebuild --clean --platform android
          cd android
          ./gradlew app:assembleDebug "-PreactNativeArchitectures=$SUPATERM_SHOWCASE_ANDROID_ABI"
          test -s app/build/outputs/apk/debug/app-debug.apk
          free -m
      - name: Save Android showcase APK
        if: steps.cached-apk.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: apps/mobile/android/app/build/outputs/apk/debug/app-debug.apk
          key: ${{ steps.cached-apk.outputs.cache-primary-key }}

      - name: Capture Android showcase
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_7_pro
          avd-name: Pixel_10_Pro
          cores: 2
          ram-size: 2048M
          disable-animations: false
          script: |
            adb shell settings put global hide_error_dialogs 1
            pnpm screenshots:mobile --platform android --appearance "$SHOWCASE_APPEARANCE" --theme "$SHOWCASE_THEME" --skip-build

      - name: Validate Google Play assets
        run: pnpm screenshots:mobile --platform android --appearance "$SHOWCASE_APPEARANCE" --theme "$SHOWCASE_THEME" --validate-only

      - name: Upload Android screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: google-play-screenshots
          path: artifacts/app-store/screenshots/google-play/
          if-no-files-found: warn
          retention-days: 14
          overwrite: true

      - name: Upload raw Android captures
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: google-play-captures
          path: artifacts/app-store/captures/google-play/
          if-no-files-found: warn
          retention-days: 14
          overwrite: true
