name: Mobile Showcase Screenshots

on:
  workflow_call:
    inputs:
      platform:
        required: true
        type: string
      appearance:
        type: string
        default: dark
      theme:
        type: string
        default: supaterm
      source_sha:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      platform:
        description: Device platforms to capture
        required: true
        default: all
        type: choice
        options:
          - all
          - ios
          - android
      appearance:
        description: System appearances to capture
        required: true
        default: both
        type: choice
        options:
          - both
          - dark
          - light
      theme:
        description: Palette to capture (all multiplies the run by the palette count)
        required: true
        default: supaterm
        type: choice
        options:
          - supaterm
          - supaterm-chat
          - grove
          - ocean
          - ember
          - iris
          - zenbones
          - all

permissions:
  contents: read

env:
  NODE_OPTIONS: --max-old-space-size=8192
  SHOWCASE_APPEARANCE: ${{ inputs.appearance }}
  SHOWCASE_THEME: ${{ inputs.theme }}

jobs:
  ios:
    name: iPhone 6.9, iPhone 6.3, iPhone 6.5, and iPad 13
    if: inputs.platform == 'all' || inputs.platform == 'ios'
    runs-on: xcode-27
    # Capturing every palette multiplies the device matrix, and only the one
    # native build is shared between them.
    timeout-minutes: ${{ inputs.theme == 'all' && 350 || 120 }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: ${{ inputs.source_sha || github.sha }}

      - name: Setup Mise
        uses: ./.github/actions/setup-mise
      - name: Select Xcode 27.1
        env:
          DEVELOPER_DIR: /Applications/Xcode_27.1.app/Contents/Developer
        run: |
          xcodebuild -version
          xcrun --find actool
          echo "DEVELOPER_DIR=$DEVELOPER_DIR" >> "$GITHUB_ENV"
      - name: Install workspace dependencies
        run: |
          mise exec -- pnpm config set virtualStoreType project --location project
          mise exec -- vp install --filter=@supaterm/mobile... --filter=@supaterm/scripts... --filter=supaterm...
      - name: Expose pnpm
        run: mise exec -- pnpm --version

      - name: Capture iOS showcase
        run: |
          capture_args=(--platform ios --appearance "$SHOWCASE_APPEARANCE" --theme "$SHOWCASE_THEME")
          devices="$(node --input-type=module -e 'import config from "./scripts/mobile-showcase.config.ts"; for (const device of config.devices) if (device.platform === "ios") console.log(device.id);')"
          skip_build=()
          while IFS= read -r device; do
            pnpm screenshots:mobile "${capture_args[@]}" --device "$device" "${skip_build[@]}"
            skip_build=(--skip-build)
          done <<< "$devices"

      - name: Validate App Store Connect assets
        run: pnpm screenshots:mobile --platform ios --appearance "$SHOWCASE_APPEARANCE" --theme "$SHOWCASE_THEME" --validate-only

      - name: Upload iOS screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: app-store-connect-screenshots
          path: artifacts/app-store/screenshots/apple/
          if-no-files-found: warn
          retention-days: 14
          overwrite: true

  android:
    name: Android phone, 7-inch tablet, and 10-inch tablet
    if: inputs.platform == 'all' || inputs.platform == 'android'
    runs-on: ubuntu-24.04
    # Capturing every palette multiplies the device matrix, and only the one
    # native build is shared between them.
    timeout-minutes: ${{ inputs.theme == 'all' && 350 || 120 }}
    env:
      SUPATERM_SHOWCASE_ANDROID_ABI: x86_64
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: ${{ inputs.source_sha || github.sha }}

      - name: Setup Mise
        uses: ./.github/actions/setup-mise
      - name: Install workspace dependencies
        run: |
          mise exec -- pnpm config set virtualStoreType project --location project
          mise exec -- vp install --filter=@supaterm/mobile... --filter=@supaterm/scripts... --filter=supaterm...
      - name: Expose pnpm
        run: mise exec -- pnpm --version

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle cache
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Build Android showcase APK
        working-directory: apps/mobile
        env:
          APP_VARIANT: production
          EXPO_NO_GIT_STATUS: "1"
          SUPATERM_SHOWCASE_CAPTURE_BUILD: "1"
          NODE_ENV: development
          GRADLE_OPTS: -Dorg.gradle.daemon=false -Dorg.gradle.workers.max=2
        run: |
          free -m
          pnpm exec expo prebuild --clean --platform android
          cd android
          ./gradlew app:assembleDebug "-PreactNativeArchitectures=$SUPATERM_SHOWCASE_ANDROID_ABI"
          test -s app/build/outputs/apk/debug/app-debug.apk
          free -m

      - name: Capture Android showcase
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_7_pro
          avd-name: Pixel_10_Pro
          cores: 2
          ram-size: 2048M
          disable-animations: false
          script: |
            adb shell settings put global hide_error_dialogs 1
            pnpm screenshots:mobile --platform android --appearance "$SHOWCASE_APPEARANCE" --theme "$SHOWCASE_THEME" --skip-build

      - name: Validate Google Play assets
        run: pnpm screenshots:mobile --platform android --appearance "$SHOWCASE_APPEARANCE" --theme "$SHOWCASE_THEME" --validate-only

      - name: Upload Android screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: google-play-screenshots
          path: artifacts/app-store/screenshots/google-play/
          if-no-files-found: warn
          retention-days: 14
          overwrite: true
