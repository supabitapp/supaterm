name: warm-cache

on:
  workflow_dispatch: {}
  push:
    branches:
      - main
    paths:
      - ".github/actions/setup-macos/**"
      - ".github/workflows/warm-cache.yml"
      - "apps/mac/Configurations/**"
      - "apps/mac/Makefile"
      - "apps/mac/Project.swift"
      - "apps/mac/Tuist.swift"
      - "apps/mac/Tuist/**"
      - "apps/mac/Workspace.swift"
      - "Makefile"
      - "mise.toml"

concurrency:
  group: warm-cache-${{ github.ref }}
  cancel-in-progress: true

jobs:
  warm-cache-debug:
    runs-on: macos-26
    permissions:
      contents: read
      id-token: write
    env:
      MISE_HTTP_TIMEOUT: 120
      MISE_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - uses: ./.github/actions/setup-macos
        with:
          restore-native-cache: false
      - run: make mac-warm-cache
      - run: make mac-warm-cache TUIST_CACHE_CONFIGURATION=Release
