name: warm-cache

on:
  push:
    branches:
      - main
    paths:
      - ".github/actions/setup-macos/**"
      - ".github/actions/setup-mise/**"
      - ".github/workflows/warm-cache.yml"
      - ".gitmodules"
      - "apps/Configurations/**"
      - "apps/supaterm-host/**"
      - "apps/mac/Configurations/**"
      - "apps/mac/Makefile"
      - "apps/mac/Project.swift"
      - "apps/mac/ThirdParty/ghostty"
      - "apps/mac/ThirdParty/ghostty/**"
      - "apps/mac/scripts/build-ghostty.sh"
      - "apps/mac/scripts/build-supaterm-host.sh"
      - "apps/shared/**"
      - "apps/Tuist.mk"
      - "apps/Tuist.swift"
      - "apps/Tuist/**"
      - "apps/Workspace.swift"
      - "Makefile"
      - "mise.toml"

concurrency:
  group: warm-cache
  cancel-in-progress: true

permissions:
  contents: read

env:
  MISE_HTTP_TIMEOUT: 120

jobs:
  warm_cache:
    name: warm-cache
    runs-on: macos-26
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          submodules: recursive
      - uses: ./.github/actions/setup-macos
        with:
          cache-native-builds: true
          github-token: ${{ github.token }}
      - run: make mac-build-supaterm-host
      - run: make mac-warm-cache
        env:
          TUIST_TOKEN: ${{ secrets.TUIST_TOKEN }}
      - run: make mac-warm-cache TUIST_CONFIGURATION=Release
        env:
          TUIST_TOKEN: ${{ secrets.TUIST_TOKEN }}
