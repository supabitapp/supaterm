name: deploy-docs

on:
  push:
    branches:
      - main
    paths:
      - "apps/docs.supaterm.com/**"
      - "apps/mac/supatermSnapshotTests/__Snapshots__/SupatermSnapshotTests/catalogScenarios.agent-panel-branch-pr-checks-dark.png"
      - "apps/mac/supatermSnapshotTests/__Snapshots__/SupatermSnapshotTests/catalogScenarios.settings-coding-agents-enabled-dark.png"
      - "apps/mac/supatermSnapshotTests/__Snapshots__/SupatermSnapshotTests/catalogScenarios.sidebar-full-dark.png"
      - "apps/supaterm.com/public/logo-mark.svg"
      - "apps/supaterm.com/public/logo.svg"
      - "integrations/supaterm/skill-data/**"
      - ".github/workflows/deploy-docs.yml"
      - ".github/scripts/vite_plus.py"
      - ".github/scripts/vite_plus_test.py"
      - "Makefile"
      - "mise.toml"
  pull_request:
    branches:
      - main
    paths:
      - "apps/docs.supaterm.com/**"
      - "apps/mac/supatermSnapshotTests/__Snapshots__/SupatermSnapshotTests/catalogScenarios.agent-panel-branch-pr-checks-dark.png"
      - "apps/mac/supatermSnapshotTests/__Snapshots__/SupatermSnapshotTests/catalogScenarios.settings-coding-agents-enabled-dark.png"
      - "apps/mac/supatermSnapshotTests/__Snapshots__/SupatermSnapshotTests/catalogScenarios.sidebar-full-dark.png"
      - "apps/supaterm.com/public/logo-mark.svg"
      - "apps/supaterm.com/public/logo.svg"
      - "integrations/supaterm/skill-data/**"
      - ".github/workflows/deploy-docs.yml"
      - ".github/scripts/vite_plus.py"
      - ".github/scripts/vite_plus_test.py"
      - "Makefile"
      - "mise.toml"
  workflow_dispatch: {}

concurrency:
  group: deploy-docs-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  docs:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          lfs: true
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - uses: jdx/mise-action@v4
        with:
          version: 2026.3.0
          cache: true
          install: false
      - name: Install pnpm with mise
        run: mise install pnpm
      - run: make tooling-test
      - run: make docs-install
      - run: make docs-check
      - run: make docs-validate
      - name: Audit production dependencies
        run: python3 .github/scripts/vite_plus.py apps/docs.supaterm.com pm audit --production --level high
      - run: make docs-build
      - name: Deploy Worker
        if: github.event_name == 'workflow_dispatch' || github.event_name == 'push'
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/docs.supaterm.com
          command: deploy
