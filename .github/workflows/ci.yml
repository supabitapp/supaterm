name: ci

on:
  workflow_call: {}
  merge_group:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  MISE_HTTP_TIMEOUT: 120

jobs:
  changes:
    name: changes
    runs-on: ubuntu-latest
    outputs:
      host: ${{ steps.changes.outputs.host }}
      mac: ${{ steps.changes.outputs.mac }}
    steps:
      - if: github.event_name == 'pull_request'
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
      - id: changes
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          EVENT_NAME: ${{ github.event_name }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$EVENT_NAME" != pull_request ]; then
            echo "host=true" >> "$GITHUB_OUTPUT"
            echo "mac=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          host=false
          mac=false
          while IFS= read -r path; do
            case "$path" in
              *.md)
                continue
                ;;
              .github/actions/setup-macos/* | .github/scripts/resign_exported_app.sh | .github/workflows/ci.yml | .github/workflows/release-tip.yml | .github/workflows/release.yml | .gitmodules | apps/host/* | apps/mac/* | integrations/supaterm-skills | Makefile | mise.toml)
                mac=true
                ;;
            esac
            case "$path" in
              .github/workflows/ci.yml | apps/host/* | apps/mac/scripts/build-host.sh | Makefile | mise.toml)
                host=true
                ;;
            esac
          done < <(git diff --no-renames --name-only "$BASE_SHA...$HEAD_SHA")
          echo "host=$host" >> "$GITHUB_OUTPUT"
          echo "mac=$mac" >> "$GITHUB_OUTPUT"

  host_check:
    name: host-check
    needs: changes
    if: needs.changes.outputs.host == 'true'
    runs-on: macos-26
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          submodules: recursive
      - uses: ./.github/actions/setup-macos
        with:
          cache-native-builds: true
          github-token: ${{ github.token }}
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: |
            ~/.cargo/git
            ~/.cargo/registry
            apps/host/target
          key: ${{ runner.os }}-${{ runner.arch }}-supaterm-host-v1-${{ hashFiles('mise.toml', 'apps/host/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-${{ runner.arch }}-supaterm-host-v1-
      - name: Format
        run: make host-format-check
      - name: Clippy
        run: make host-clippy
      - name: Test
        run: make host-test

  swiftlint:
    name: swiftlint
    needs: changes
    if: needs.changes.outputs.mac == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654
        env:
          MISE_GITHUB_TOKEN: ${{ github.token }}
        with:
          version: 2026.8.5
          cache: true
          install: false
      - run: mise install -C "$RUNNER_TEMP" "swiftlint@$(mise current swiftlint)"
        env:
          MISE_GITHUB_TOKEN: ${{ github.token }}
      - run: make swiftlint

  mac_test:
    name: mac-test
    needs: changes
    if: needs.changes.outputs.mac == 'true'
    runs-on: macos-26
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          submodules: recursive
      - uses: ./.github/actions/setup-macos
        with:
          cache-native-builds: true
          github-token: ${{ github.token }}
      - run: make mac-test
        env:
          TUIST_TOKEN: ${{ secrets.TUIST_TOKEN }}

  mac_test_e2e:
    name: mac-test-e2e
    needs: changes
    if: needs.changes.outputs.mac == 'true'
    runs-on: macos-26
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          submodules: recursive
      - uses: ./.github/actions/setup-macos
        with:
          cache-native-builds: true
          github-token: ${{ github.token }}
      - run: make mac-test-e2e E2E_RESULT_BUNDLE_PATH="$RUNNER_TEMP/supatermE2E.xcresult"
        env:
          TUIST_TOKEN: ${{ secrets.TUIST_TOKEN }}
      - if: failure()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: mac-test-e2e-xcresult
          path: ${{ runner.temp }}/supatermE2E.xcresult
          if-no-files-found: ignore

  mac_test_ui_build:
    name: mac-test-ui-build
    needs: changes
    if: needs.changes.outputs.mac == 'true'
    runs-on: macos-26
    timeout-minutes: 60
    outputs:
      matrix: ${{ steps.build.outputs.matrix }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          submodules: recursive
      - uses: ./.github/actions/setup-macos
        with:
          cache-native-builds: true
          github-token: ${{ github.token }}
      - run: make mac-tuist-install
        env:
          TUIST_TOKEN: ${{ secrets.TUIST_TOKEN }}
      - run: make -C apps/mac build-host build-ghostty build-zmx build-ap
      - id: build
        run: mise exec -- tuist test supatermUITests --build-only --configuration Debug --shard-total 12 --shard-granularity suite
        working-directory: apps/mac
        env:
          TUIST_TOKEN: ${{ secrets.TUIST_TOKEN }}
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: mac-test-ui-project
          path: |
            apps/mac/supaterm.xcworkspace
            apps/mac/supaterm.xcodeproj
          retention-days: 1
          overwrite: true

  mac_test_ui:
    name: mac-test-ui (${{ matrix.shard }})
    needs: mac_test_ui_build
    if: >-
      needs.mac_test_ui_build.result == 'success' &&
      toJSON(fromJSON(needs.mac_test_ui_build.outputs.matrix || '{"shard":[]}').shard) != '[]'
    runs-on: macos-26
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.mac_test_ui_build.outputs.matrix) }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: ./.github/actions/setup-macos
        with:
          cache-native-builds: false
          github-token: ${{ github.token }}
      - run: mise exec -- tuist test --without-building --configuration Debug --inspect-mode off --result-bundle-path "$RUNNER_TEMP/supatermUITests.xcresult" -- -destination "platform=macOS"
        working-directory: apps/mac
        env:
          TUIST_TOKEN: ${{ secrets.TUIST_TOKEN }}
          TUIST_SHARD_INDEX: ${{ matrix.shard }}
          TUIST_SHARD_PLAN_ID: ${{ matrix.shard_plan_id }}
      - if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: mac-test-ui-xcresult-${{ matrix.shard }}
          path: ${{ runner.temp }}/supatermUITests.xcresult
          if-no-files-found: ignore
          retention-days: 1
          overwrite: true

  mac_test_ui_results:
    name: mac-test-ui-results
    needs:
      - mac_test_ui_build
      - mac_test_ui
    if: needs.mac_test_ui.result == 'success'
    runs-on: macos-26
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: ./.github/actions/setup-macos
        with:
          cache-native-builds: false
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          name: mac-test-ui-project
          path: apps/mac
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          pattern: mac-test-ui-xcresult-*
          path: ${{ runner.temp }}/supatermUITests
      - run: |
          set --
          while IFS= read -r result_bundle; do
            set -- "$@" "$result_bundle"
          done < <(find "$RUNNER_TEMP/supatermUITests" -mindepth 1 -maxdepth 1 -type d -name 'mac-test-ui-xcresult-*' -print | sort)
          test "$#" -eq "$(jq -r '.shard | length' <<< "$SHARD_MATRIX")"
          xcrun xcresulttool merge --output-path "$RUNNER_TEMP/supatermUITests.xcresult" "$@"
        env:
          SHARD_MATRIX: ${{ needs.mac_test_ui_build.outputs.matrix }}
      - run: mise exec -- tuist inspect test --mode local "$RUNNER_TEMP/supatermUITests.xcresult"
        working-directory: apps/mac
        env:
          TUIST_TOKEN: ${{ secrets.TUIST_TOKEN }}
          TUIST_INSPECT_TEST_WAIT: YES

  required_checks:
    name: required-checks
    if: always()
    needs:
      - changes
      - host_check
      - swiftlint
      - mac_test
      - mac_test_e2e
      - mac_test_ui_build
      - mac_test_ui
    runs-on: ubuntu-latest
    env:
      CHANGES: ${{ needs.changes.result }}
      HOST: ${{ needs.changes.outputs.host }}
      HOST_CHECK: ${{ needs.host_check.result }}
      MAC: ${{ needs.changes.outputs.mac }}
      SWIFTLINT: ${{ needs.swiftlint.result }}
      UNIT: ${{ needs.mac_test.result }}
      E2E: ${{ needs.mac_test_e2e.result }}
      UI_BUILD: ${{ needs.mac_test_ui_build.result }}
      UI: ${{ needs.mac_test_ui.result }}
    steps:
      - run: |
          test "$CHANGES" = success
          if [ "$HOST" = true ]; then
            test "$HOST_CHECK" = success
          fi
          if [ "$MAC" = true ]; then
            test "$SWIFTLINT" = success
            test "$UNIT" = success
            test "$E2E" = success
            test "$UI_BUILD" = success
            test "$UI" = success
          fi
