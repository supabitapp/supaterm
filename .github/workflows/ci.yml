name: ci

on:
  workflow_call: {}
  workflow_dispatch: {}
  merge_group:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  MISE_HTTP_TIMEOUT: 120

jobs:
  changes:
    name: changes
    runs-on: ubuntu-latest
    outputs:
      mac: ${{ steps.changes.outputs.mac }}
    steps:
      - if: github.event_name == 'pull_request'
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
      - id: changes
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          EVENT_NAME: ${{ github.event_name }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$EVENT_NAME" != pull_request ]; then
            echo "mac=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          mac=false
          while IFS= read -r path; do
            case "$path" in
              *.md)
                continue
                ;;
              .github/actions/setup-macos/* | .github/actions/setup-mise/* | .github/workflows/ci.yml | .gitmodules | apps/mac/* | fnox.toml | integrations/supaterm-skills | Makefile | mise.toml)
                mac=true
                ;;
            esac
          done < <(git diff --no-renames --name-only "$BASE_SHA...$HEAD_SHA")
          echo "mac=$mac" >> "$GITHUB_OUTPUT"

  swiftlint:
    name: swiftlint
    needs: changes
    if: needs.changes.outputs.mac == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: ./.github/actions/setup-mise
        with:
          github-token: ${{ github.token }}
          install: false
      - run: mise install -C "$RUNNER_TEMP" "swiftlint@$(mise current swiftlint)"
        env:
          MISE_GITHUB_TOKEN: ${{ github.token }}
      - run: make swiftlint

  mac_test:
    name: mac-test
    needs: changes
    if: needs.changes.outputs.mac == 'true'
    runs-on: macos-26
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          submodules: recursive
      - uses: ./.github/actions/setup-macos
        with:
          cache-native-builds: true
          github-token: ${{ github.token }}
      - run: make mac-test
        env:
          TUIST_TOKEN: ${{ secrets.TUIST_TOKEN }}

  mac_test_e2e:
    name: mac-test-e2e
    needs: changes
    if: needs.changes.outputs.mac == 'true'
    runs-on: macos-26
    env:
      CODEX_BALANCER_API_KEY: ${{ secrets.CODEX_BALANCER_API_KEY }}
      CODEX_BALANCER_BASE_URL: ${{ secrets.CODEX_BALANCER_BASE_URL }}
      SUPATERM_LIVE_CODEX_E2E: ${{ (github.event_name == 'workflow_dispatch' || github.event_name == 'merge_group' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)) && '1' || '0' }}
    steps:
      - name: Check live Codex secrets
        if: env.SUPATERM_LIVE_CODEX_E2E == '1'
        run: |
          test -n "$CODEX_BALANCER_API_KEY"
          test -n "$CODEX_BALANCER_BASE_URL"
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          submodules: recursive
      - uses: ./.github/actions/setup-macos
        with:
          cache-native-builds: true
          github-token: ${{ github.token }}
      - run: make mac-test-e2e E2E_RESULT_BUNDLE_PATH="$RUNNER_TEMP/supatermE2E.xcresult"
        env:
          TUIST_TOKEN: ${{ secrets.TUIST_TOKEN }}
      - if: failure()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: mac-test-e2e-xcresult
          path: ${{ runner.temp }}/supatermE2E.xcresult
          if-no-files-found: ignore

  mac_test_ui_build:
    name: mac-test-ui-build
    needs: changes
    if: needs.changes.outputs.mac == 'true'
    runs-on: macos-26
    timeout-minutes: 60
    outputs:
      matrix: ${{ steps.build.outputs.matrix }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          submodules: recursive
      - uses: ./.github/actions/setup-macos
        with:
          cache-native-builds: true
          github-token: ${{ github.token }}
      - run: make mac-tuist-install
        env:
          TUIST_TOKEN: ${{ secrets.TUIST_TOKEN }}
      - run: make -C apps/mac build-ghostty build-zmx build-ap
      - id: build
        run: mise exec -- tuist test supatermUITests --build-only --configuration Debug --shard-total 12 --shard-granularity suite
        working-directory: apps/mac
        env:
          TUIST_TOKEN: ${{ secrets.TUIST_TOKEN }}
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: mac-test-ui-project
          path: |
            apps/mac/supaterm.xcworkspace
            apps/mac/supaterm.xcodeproj
          retention-days: 1
          overwrite: true

  mac_test_ui:
    name: mac-test-ui (${{ matrix.shard }})
    needs: mac_test_ui_build
    if: >-
      needs.mac_test_ui_build.result == 'success' &&
      toJSON(fromJSON(needs.mac_test_ui_build.outputs.matrix || '{"shard":[]}').shard) != '[]'
    runs-on: macos-26
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.mac_test_ui_build.outputs.matrix) }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: ./.github/actions/setup-macos
        with:
          cache-native-builds: false
          github-token: ${{ github.token }}
      - run: mise exec -- tuist test --without-building --configuration Debug --inspect-mode off --result-bundle-path "$RUNNER_TEMP/supatermUITests.xcresult" -- -destination "platform=macOS"
        working-directory: apps/mac
        env:
          TUIST_TOKEN: ${{ secrets.TUIST_TOKEN }}
          TUIST_SHARD_INDEX: ${{ matrix.shard }}
          TUIST_SHARD_PLAN_ID: ${{ matrix.shard_plan_id }}
      - if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: mac-test-ui-xcresult-${{ matrix.shard }}
          path: ${{ runner.temp }}/supatermUITests.xcresult
          if-no-files-found: ignore
          retention-days: 1
          overwrite: true

  mac_test_ui_results:
    name: mac-test-ui-results
    needs:
      - mac_test_ui_build
      - mac_test_ui
    if: needs.mac_test_ui.result == 'success'
    runs-on: macos-26
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: ./.github/actions/setup-macos
        with:
          cache-native-builds: false
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          name: mac-test-ui-project
          path: apps/mac
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          pattern: mac-test-ui-xcresult-*
          path: ${{ runner.temp }}/supatermUITests
      - run: |
          set --
          while IFS= read -r result_bundle; do
            set -- "$@" "$result_bundle"
          done < <(find "$RUNNER_TEMP/supatermUITests" -mindepth 1 -maxdepth 1 -type d -name 'mac-test-ui-xcresult-*' -print | sort)
          test "$#" -eq "$(jq -r '.shard | length' <<< "$SHARD_MATRIX")"
          xcrun xcresulttool merge --output-path "$RUNNER_TEMP/supatermUITests.xcresult" "$@"
        env:
          SHARD_MATRIX: ${{ needs.mac_test_ui_build.outputs.matrix }}
      - run: mise exec -- tuist inspect test --mode local "$RUNNER_TEMP/supatermUITests.xcresult"
        working-directory: apps/mac
        env:
          TUIST_TOKEN: ${{ secrets.TUIST_TOKEN }}
          TUIST_INSPECT_TEST_WAIT: YES

  required_checks:
    name: required-checks
    if: always()
    needs:
      - changes
      - swiftlint
      - mac_test
      - mac_test_e2e
      - mac_test_ui_build
      - mac_test_ui
    runs-on: ubuntu-latest
    env:
      MAC: ${{ needs.changes.outputs.mac }}
      SWIFTLINT: ${{ needs.swiftlint.result }}
      UNIT: ${{ needs.mac_test.result }}
      E2E: ${{ needs.mac_test_e2e.result }}
      UI_BUILD: ${{ needs.mac_test_ui_build.result }}
      UI: ${{ needs.mac_test_ui.result }}
    steps:
      - run: |
          if [ "$MAC" = false ]; then
            exit 0
          fi
          test "$SWIFTLINT" = success
          test "$UNIT" = success
          test "$E2E" = success
          test "$UI_BUILD" = success
          test "$UI" = success
