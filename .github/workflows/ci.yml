name: ci

on:
  workflow_call: {}
  merge_group:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  MISE_HTTP_TIMEOUT: 120

jobs:
  changes:
    name: changes
    runs-on: ubuntu-latest
    outputs:
      ios: ${{ steps.changes.outputs.ios }}
      mac: ${{ steps.changes.outputs.mac }}
    steps:
      - if: github.event_name == 'pull_request'
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
      - if: github.event_name == 'pull_request'
        run: python3 -m unittest discover -s .github/scripts -p '*_test.py'
      - id: changes
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          EVENT_NAME: ${{ github.event_name }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$EVENT_NAME" != pull_request ]; then
            echo "ios=true" >> "$GITHUB_OUTPUT"
            echo "mac=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          python3 .github/scripts/affected_projects.py \
            --base "$BASE_SHA" \
            --head "$HEAD_SHA" >> "$GITHUB_OUTPUT"

  swiftlint:
    name: swiftlint
    needs: changes
    if: needs.changes.outputs.ios == 'true' || needs.changes.outputs.mac == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: ./.github/actions/setup-mise
        with:
          github-token: ${{ github.token }}
          install: false
      - run: mise install -C "$RUNNER_TEMP" "swiftlint@$(mise current swiftlint)"
        env:
          MISE_GITHUB_TOKEN: ${{ github.token }}
      - run: make swiftlint

  ios_build:
    name: ios-build
    needs: changes
    if: needs.changes.outputs.ios == 'true'
    runs-on: macos-26
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: ./.github/actions/setup-macos
        with:
          cache-native-builds: false
          github-token: ${{ github.token }}
      - run: make ios-build
        env:
          TUIST_TOKEN: ${{ secrets.TUIST_TOKEN }}

  mac_test:
    name: mac-test
    needs: changes
    if: needs.changes.outputs.mac == 'true'
    runs-on: macos-26
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          submodules: recursive
      - uses: ./.github/actions/setup-macos
        with:
          cache-native-builds: true
          github-token: ${{ github.token }}
      - run: make mac-test
        env:
          TUIST_TOKEN: ${{ secrets.TUIST_TOKEN }}

  mac_test_e2e:
    name: mac-test-e2e
    needs: changes
    if: needs.changes.outputs.mac == 'true'
    runs-on: macos-26
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          submodules: recursive
      - uses: ./.github/actions/setup-macos
        with:
          cache-native-builds: true
          github-token: ${{ github.token }}
      - run: >-
          make mac-test-e2e
          E2E_RESULT_BUNDLE_PATH="$RUNNER_TEMP/supatermE2E.xcresult"
        env:
          TUIST_TOKEN: ${{ secrets.TUIST_TOKEN }}
      - if: failure()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: mac-test-e2e-xcresult
          path: ${{ runner.temp }}/supatermE2E.xcresult
          if-no-files-found: ignore

  mac_test_agent_e2e:
    name: mac-test-agent-e2e
    needs: changes
    if: needs.changes.outputs.mac == 'true'
    runs-on: macos-26
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          submodules: recursive
      - uses: ./.github/actions/setup-macos
        with:
          cache-native-builds: true
          github-token: ${{ github.token }}
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: ~/.local/share/mise/installs
          key: agent-e2e-${{ runner.os }}-${{ runner.arch }}-all-${{ hashFiles('apps/mac/Makefile') }}
      - run: >-
          make mac-test-e2e
          E2E_AGENT=all
          E2E_RESULT_BUNDLE_PATH="$RUNNER_TEMP/supatermAgentE2E.xcresult"
          XCODEBUILD_FLAGS="
          -parallel-testing-enabled NO
          -only-testing:supatermE2E/AgentNarrowTabE2ETests
          -only-testing:supatermE2E/CodexE2ETests
          -only-testing:supatermE2E/CodexHookRoutingE2ETests
          -only-testing:supatermE2E/CodexZmxE2ETests
          -only-testing:supatermE2E/ClaudeE2ETests
          -only-testing:supatermE2E/ClaudeZmxE2ETests
          -only-testing:supatermE2E/PiE2ETests
          -only-testing:supatermE2E/PiZmxE2ETests"
        env:
          TUIST_TOKEN: ${{ secrets.TUIST_TOKEN }}
      - if: failure()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: mac-test-agent-e2e-xcresult
          path: ${{ runner.temp }}/supatermAgentE2E.xcresult
          if-no-files-found: ignore

  mac_test_ui_build:
    name: mac-test-ui-build
    needs: changes
    if: needs.changes.outputs.mac == 'true'
    runs-on: macos-26
    timeout-minutes: 60
    outputs:
      matrix: ${{ steps.build.outputs.matrix }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          submodules: recursive
      - uses: ./.github/actions/setup-macos
        with:
          cache-native-builds: true
          github-token: ${{ github.token }}
      - run: make mac-tuist-install
        env:
          TUIST_TOKEN: ${{ secrets.TUIST_TOKEN }}
      - run: make -C apps/mac build-ghostty build-zmx build-ap
      - id: build
        run: mise exec -- tuist test supatermUITests --build-only --configuration Debug --shard-total 12 --shard-granularity suite
        working-directory: apps/mac
        env:
          TUIST_TOKEN: ${{ secrets.TUIST_TOKEN }}
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: mac-test-ui-project
          path: |
            apps/mac/supaterm.xcworkspace
            apps/mac/supaterm.xcodeproj
          retention-days: 1
          overwrite: true

  mac_test_ui:
    name: mac-test-ui (${{ matrix.shard }})
    needs: mac_test_ui_build
    if: >-
      needs.mac_test_ui_build.result == 'success' &&
      toJSON(fromJSON(needs.mac_test_ui_build.outputs.matrix || '{"shard":[]}').shard) != '[]'
    runs-on: macos-26
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.mac_test_ui_build.outputs.matrix) }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: ./.github/actions/setup-macos
        with:
          cache-native-builds: false
          github-token: ${{ github.token }}
      - run: mise exec -- tuist test --without-building --configuration Debug --inspect-mode off --result-bundle-path "$RUNNER_TEMP/supatermUITests.xcresult" -- -destination "platform=macOS"
        working-directory: apps/mac
        env:
          TUIST_TOKEN: ${{ secrets.TUIST_TOKEN }}
          TUIST_SHARD_INDEX: ${{ matrix.shard }}
          TUIST_SHARD_PLAN_ID: ${{ matrix.shard_plan_id }}
      - if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: mac-test-ui-xcresult-${{ matrix.shard }}
          path: ${{ runner.temp }}/supatermUITests.xcresult
          if-no-files-found: ignore
          retention-days: 1
          overwrite: true

  mac_test_ui_results:
    name: mac-test-ui-results
    needs:
      - mac_test_ui_build
      - mac_test_ui
    if: needs.mac_test_ui.result == 'success'
    runs-on: macos-26
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: ./.github/actions/setup-macos
        with:
          cache-native-builds: false
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          name: mac-test-ui-project
          path: apps/mac
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          pattern: mac-test-ui-xcresult-*
          path: ${{ runner.temp }}/supatermUITests
      - run: |
          set --
          while IFS= read -r result_bundle; do
            set -- "$@" "$result_bundle"
          done < <(find "$RUNNER_TEMP/supatermUITests" -mindepth 1 -maxdepth 1 -type d -name 'mac-test-ui-xcresult-*' -print | sort)
          test "$#" -eq "$(jq -r '.shard | length' <<< "$SHARD_MATRIX")"
          xcrun xcresulttool merge --output-path "$RUNNER_TEMP/supatermUITests.xcresult" "$@"
        env:
          SHARD_MATRIX: ${{ needs.mac_test_ui_build.outputs.matrix }}
      - run: mise exec -- tuist inspect test --mode local "$RUNNER_TEMP/supatermUITests.xcresult"
        working-directory: apps/mac
        env:
          TUIST_TOKEN: ${{ secrets.TUIST_TOKEN }}
          TUIST_INSPECT_TEST_WAIT: YES

  required_checks:
    name: required-checks
    if: always()
    needs:
      - changes
      - swiftlint
      - ios_build
      - mac_test
      - mac_test_e2e
      - mac_test_agent_e2e
      - mac_test_ui_build
      - mac_test_ui
    runs-on: ubuntu-latest
    env:
      CHANGES: ${{ needs.changes.result }}
      IOS: ${{ needs.changes.outputs.ios }}
      IOS_BUILD: ${{ needs.ios_build.result }}
      MAC: ${{ needs.changes.outputs.mac }}
      SWIFTLINT: ${{ needs.swiftlint.result }}
      UNIT: ${{ needs.mac_test.result }}
      E2E: ${{ needs.mac_test_e2e.result }}
      AGENT_E2E: ${{ needs.mac_test_agent_e2e.result }}
      UI_BUILD: ${{ needs.mac_test_ui_build.result }}
      UI: ${{ needs.mac_test_ui.result }}
    steps:
      - run: |
          test "$CHANGES" = success
          if [ "$IOS" = true ] || [ "$MAC" = true ]; then
            test "$SWIFTLINT" = success
          fi
          if [ "$IOS" = true ]; then
            test "$IOS_BUILD" = success
          fi
          if [ "$MAC" = true ]; then
            test "$UNIT" = success
            test "$E2E" = success
            test "$AGENT_E2E" = success
            test "$UI_BUILD" = success
            test "$UI" = success
          fi
