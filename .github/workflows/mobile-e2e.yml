name: Mobile Layout E2E

on:
  workflow_dispatch:
    inputs:
      platform:
        description: Platforms to check
        type: choice
        options: [all, ios, android]
        default: all
      poses:
        description: Space-separated pose IDs, empty runs every supported pose
        type: string
        default: ""
      ios_runner:
        description: Free iOS runner; macOS 26 comparison requires explicit iPad poses
        type: choice
        options: [xcode-27, macos-26]
        default: xcode-27
      diagnose_ios_install:
        description: Capture install diagnostics with a 15-minute probe deadline
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  prepare:
    name: Select mobile poses
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.matrix.outputs.value }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-mise
      - id: matrix
        env:
          MOBILE_PLATFORM: ${{ inputs.platform }}
          E2E_POSES: ${{ inputs.poses }}
          MOBILE_IOS_RUNNER: ${{ inputs.ios_runner }}
        run: node scripts/mobile-e2e/matrix.ts
  mobile-e2e:
    needs: prepare
    name: Mobile layout (${{ matrix.name }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: ${{ matrix.platform == 'ios' && 120 || 90 }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    env:
      NODE_OPTIONS: --max-old-space-size=6144
      APP_VARIANT: development
      MOBILE_VERSION_POLICY: appVersion
      SUPATERM_IOS_PERSONAL_TEAM: "0"
      SUPATERM_E2E_ANDROID_IMAGE: system-images;android-36;google_apis;x86_64
      ORG_GRADLE_PROJECT_reactNativeArchitectures: x86_64
      GRADLE_OPTS: -Dorg.gradle.daemon=false -Dorg.gradle.workers.max=2
      SUPATERM_E2E_IOS_INSTALL_PROBE: ${{ inputs.diagnose_ios_install && matrix.platform == 'ios' && '1' || '0' }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-mise
      - name: Select Xcode
        if: matrix.platform == 'ios'
        env:
          IOS_RUNNER: ${{ matrix.runner }}
        run: |
          if [ "$IOS_RUNNER" = macos-26 ]; then
            developer_dir=/Applications/Xcode_26.6.app/Contents/Developer
            echo "SUPATERM_E2E_IOS_RUNTIME=com.apple.CoreSimulator.SimRuntime.iOS-26-5" >> "$GITHUB_ENV"
          else
            developer_dir=/Applications/Xcode_27.1.app/Contents/Developer
          fi
          echo "DEVELOPER_DIR=$developer_dir" >> "$GITHUB_ENV"
          "$developer_dir/usr/bin/xcodebuild" -version
          defaults write com.apple.iphonesimulator ConnectHardwareKeyboard -bool false
      - name: Verify macOS 26 simulator support
        if: matrix.runner == 'macos-26'
        run: |
          xcrun simctl list runtimes | grep -F 'com.apple.CoreSimulator.SimRuntime.iOS-26-5'
          xcrun simctl list devicetypes | grep -F 'com.apple.CoreSimulator.SimDeviceType.iPad-Pro-13-inch-M5-16GB'
      - name: Install dependencies
        run: |
          mise exec -- pnpm config set virtualStoreType project --location project
          mise exec -- vp install --filter=@supaterm/mobile... --filter=@supaterm/scripts... --filter=supaterm...
      - uses: actions/setup-java@v6
        if: matrix.platform == 'android'
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6
        if: matrix.platform == 'android'
      - name: Prepare Android emulators
        if: matrix.platform == 'android'
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "cmdline-tools;23.0"
          tools="$ANDROID_HOME/cmdline-tools/23.0/bin"
          "$tools/sdkmanager" "$SUPATERM_E2E_ANDROID_IMAGE" platform-tools emulator
          "$tools/avdmanager" list device -c | grep -qx pixel_fold
          echo "SUPATERM_E2E_AVDMANAGER=$tools/avdmanager" >> "$GITHUB_ENV"
      - name: Install video tools
        run: |
          if ! command -v ffmpeg >/dev/null; then
            if [ "$RUNNER_OS" = macOS ]; then
              brew install ffmpeg
            else
              sudo apt-get update
              sudo apt-get install -y ffmpeg
            fi
          fi
      - name: Read native fingerprint
        id: fingerprint
        working-directory: apps/mobile
        env:
          MOBILE_PLATFORM: ${{ matrix.platform }}
        run: |
          node <<'JS'
          const fs = require('node:fs');
          require('expo/fingerprint').createFingerprintAsync(process.cwd(), {
            platforms: [process.env.MOBILE_PLATFORM],
            silent: true,
          }).then(({ hash }) => {
            fs.appendFileSync(process.env.GITHUB_OUTPUT, `hash=${hash}\n`);
          }).catch(error => {
            console.error(error);
            process.exitCode = 1;
          });
          JS
      - name: Restore native clients
        id: native-cache
        uses: actions/cache/restore@v5
        with:
          path: ~/.cache/supaterm/mobile-e2e
          key: mobile-e2e-${{ runner.os }}-${{ runner.arch }}${{ matrix.runner == 'macos-26' && '-xcode-26' || '' }}-${{ steps.fingerprint.outputs.hash }}-v2
      - name: Run mobile checks
        env:
          MOBILE_PLATFORM: ${{ matrix.platform }}
          E2E_POSES: ${{ matrix.poses }}
        run: |
          args=(--platform "$MOBILE_PLATFORM" --output "$RUNNER_TEMP/mobile-e2e")
          read -r -a poses <<< "$E2E_POSES"
          for pose in "${poses[@]}"; do args+=(--pose "$pose"); done
          vp run mobile:e2e "${args[@]}"
      - name: Check completed native client
        id: native-client
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/mobile-e2e/native-client.txt" ]; then
            echo 'ready=true' >> "$GITHUB_OUTPUT"
          fi
      - name: Save native clients
        if: always() && steps.native-client.outputs.ready == 'true' && steps.native-cache.outputs.cache-hit != 'true' && steps.native-cache.outputs.cache-primary-key != ''
        uses: actions/cache/save@v5
        with:
          path: ~/.cache/supaterm/mobile-e2e
          key: ${{ steps.native-cache.outputs.cache-primary-key }}
      - name: Upload reports and recordings
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mobile-e2e-${{ matrix.name }}
          path: ${{ runner.temp }}/mobile-e2e/
          if-no-files-found: warn
          retention-days: 14
