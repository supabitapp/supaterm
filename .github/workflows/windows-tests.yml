# On-demand Windows test lane. Manual only: nothing in the suite passes on
# Windows yet, so this exists to give contributors (and agents) a cloud Windows
# box to iterate against. Once the suite is green here, fold it into ci.yml.
#
#   gh workflow run windows-tests.yml --ref <branch> -f package=packages/shared
#   gh workflow run windows-tests.yml --ref <branch> -f package=apps/server \
#     -f files="src/process/externalLauncher.test.ts src/cli/theme.test.ts"
#   gh run watch && gh run view --log-failed
name: Windows Tests

on:
  workflow_dispatch:
    inputs:
      package:
        description: "Workspace directory to test, e.g. apps/server or packages/shared. Empty runs every package except apps/server."
        type: string
        default: ""
      files:
        description: "Space-separated test files relative to the package directory. Empty runs the package's whole suite. Requires package."
        type: string
        default: ""

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ inputs.package || 'all non-server' }})
    runs-on: windows-2025
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Mise
        uses: ./.github/actions/setup-mise
      - name: Resolve package cache path
        id: package_cache_path
        shell: pwsh
        run: '"path=$(vp pm cache dir)" >> $env:GITHUB_OUTPUT'

      - name: Cache packages
        uses: actions/cache@v6
        with:
          path: ${{ steps.package_cache_path.outputs.path }}
          key: windows-tests-packages-v1-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install
        run: vp install

      - name: Ensure Electron runtime is installed
        if: inputs.package == '' || inputs.package == 'apps/desktop'
        run: vp run --filter "@supaterm/desktop" ensure:electron

      # The web test script runs its browser project in headless Chromium, which
      # installing dependencies does not download. Keyed like ci.yml's cache.
      - name: Resolve Playwright version
        if: inputs.package == '' || inputs.package == 'apps/web'
        id: playwright_version
        shell: bash
        run: echo "version=$(node -p "require('./apps/web/node_modules/playwright/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache Chromium
        if: inputs.package == '' || inputs.package == 'apps/web'
        id: chromium_cache
        uses: actions/cache@v6
        with:
          path: ~/AppData/Local/ms-playwright
          key: playwright-chromium-shell-${{ runner.os }}-${{ runner.arch }}-${{ steps.playwright_version.outputs.version }}

      - name: Install Chromium for web browser tests
        if: (inputs.package == '' || inputs.package == 'apps/web') && steps.chromium_cache.outputs.cache-hit != 'true'
        run: node apps/web/node_modules/playwright/cli.js install --only-shell chromium

      # `vp run ... test -- <files>` does not forward positional args to vitest,
      # so file-scoped runs call `vp test run` inside the package instead.
      - name: Test
        shell: pwsh
        env:
          INPUTS_PACKAGE: ${{ inputs.package }}
          INPUTS_FILES: ${{ inputs.files }}
        run: |
          $package = $env:INPUTS_PACKAGE
          $files = $env:INPUTS_FILES
          if ($package -eq '') {
            vp run --parallel --concurrency-limit 4 --filter '!supaterm' --filter '!@supaterm/monorepo' test
          } elseif ($files -eq '') {
            vp run --filter "./$package" test
          } else {
            Set-Location $package
            vp test run $files.Split(' ')
          }
