name: release-tip

on:
  push:
    branches:
      - main
    paths:
      - ".github/actions/setup-macos/**"
      - ".github/actions/setup-mise/**"
      - ".github/scripts/**"
      - ".github/workflows/ci.yml"
      - ".github/workflows/release-tip.yml"
      - ".gitmodules"
      - "apps/Configurations/**"
      - "apps/mac/**"
      - "apps/shared/**"
      - "apps/Tuist.mk"
      - "apps/Tuist.swift"
      - "apps/Tuist/**"
      - "Makefile"
      - "mise.toml"
      - "!**/*.md"
      - "integrations/supaterm/skill-data/**"
      - "integrations/supaterm/skills/supaterm/**"

concurrency:
  group: release-tip
  cancel-in-progress: true

jobs:
  ci:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read
    secrets: inherit

  build:
    runs-on: macos-26
    permissions:
      actions: read
      contents: write
    outputs:
      build-number: ${{ steps.build-number.outputs.build-number }}
      stable-tag: ${{ steps.tip-appcast.outputs.stable-tag }}
    env:
      MISE_HTTP_TIMEOUT: 120
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          submodules: recursive
      - uses: ./.github/actions/setup-macos
        with:
          cache-native-builds: true
          github-token: ${{ github.token }}
      - name: Compute tip build number
        id: build-number
        run: |
          BUILD_NUMBER=$(/usr/bin/python3 .github/scripts/bump_and_release.py tip-build-number "${{ github.run_number }}")
          echo "BUILD_NUMBER=$BUILD_NUMBER" >> "$GITHUB_ENV"
          echo "build-number=$BUILD_NUMBER" >> "$GITHUB_OUTPUT"
      - name: Compute release day
        run: |
          RELEASE_DAY=$(/usr/bin/python3 .github/scripts/bump_and_release.py release-day HEAD)
          echo "RELEASE_DAY=$RELEASE_DAY" >> "$GITHUB_ENV"
      - name: Setup keychain
        env:
          DEVELOPER_ID_CERT_P12: ${{ secrets.DEVELOPER_ID_CERT_P12 }}
          DEVELOPER_ID_CERT_PASSWORD: ${{ secrets.DEVELOPER_ID_CERT_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          echo "$DEVELOPER_ID_CERT_P12" | base64 --decode > build-cert.p12
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security set-keychain-settings -t 3600 -u build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security import build-cert.p12 -k build.keychain -P "$DEVELOPER_ID_CERT_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security -T /usr/bin/xcodebuild > /dev/null
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" build.keychain > /dev/null
          existing_keychains=()
          while IFS= read -r keychain; do
            existing_keychains+=("$keychain")
          done < <(security list-keychains -d user | tr -d '"')
          security list-keychains -d user -s build.keychain "${existing_keychains[@]}"
          security default-keychain -s build.keychain
          DEVELOPER_ID_IDENTITY_SHA=$(security find-identity -v -p codesigning build.keychain | grep "Developer ID Application" | head -1 | awk '{print $2}')
          if [ -z "$DEVELOPER_ID_IDENTITY_SHA" ]; then
            echo "::error::Developer ID Application identity not found in keychain"
            exit 1
          fi
          echo "DEVELOPER_ID_IDENTITY_SHA=$DEVELOPER_ID_IDENTITY_SHA" >> "$GITHUB_ENV"
      - run: make mac-tuist-install
        env:
          TUIST_TOKEN: ${{ secrets.TUIST_TOKEN }}
      - run: make mac-tuist-generate-release-cached
        env:
          TUIST_TOKEN: ${{ secrets.TUIST_TOKEN }}
      - run: make mac-build-ghostty
      - run: make mac-build-zmx
      - run: make mac-build-ap
      - run: make mac-archive-xcodebuild XCODEBUILD_FLAGS='CURRENT_PROJECT_VERSION=${{ env.BUILD_NUMBER }} SUPATERM_RELEASE_DATE=${{ env.RELEASE_DAY }}'
      - name: Write export options
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          DEVELOPER_ID_IDENTITY: ${{ secrets.DEVELOPER_ID_IDENTITY }}
        run: |
          mkdir -p apps/mac/build
          cat > apps/mac/build/ExportOptions.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>developer-id</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>signingCertificate</key>
            <string>$DEVELOPER_ID_IDENTITY</string>
            <key>teamID</key>
            <string>$APPLE_TEAM_ID</string>
          </dict>
          </plist>
          EOF
      - run: make mac-export-archive
      - name: Verify release day
        run: |
          APP_PATH=$(find apps/mac/build/export -maxdepth 3 -name 'supaterm.app' -print -quit)
          test "$(plutil -extract SupatermReleaseDate raw "$APP_PATH/Contents/Info.plist")" = "$RELEASE_DAY"
      - name: Re-sign embedded code
        run: bash ./.github/scripts/resign_exported_app.sh apps/mac/build/export
      - name: Store notarization credentials
        env:
          APPLE_NOTARIZATION_ISSUER: ${{ secrets.APPLE_NOTARIZATION_ISSUER }}
          APPLE_NOTARIZATION_KEY: ${{ secrets.APPLE_NOTARIZATION_KEY }}
          APPLE_NOTARIZATION_KEY_ID: ${{ secrets.APPLE_NOTARIZATION_KEY_ID }}
        run: |
          echo "$APPLE_NOTARIZATION_KEY" > notarization_key.p8
          xcrun notarytool store-credentials "notarytool-profile" \
            --key notarization_key.p8 \
            --key-id "$APPLE_NOTARIZATION_KEY_ID" \
            --issuer "$APPLE_NOTARIZATION_ISSUER"
          rm notarization_key.p8
      - name: Build DMG
        run: |
          APP_PATH=$(find apps/mac/build/export -maxdepth 3 -name 'supaterm.app' -print -quit)
          mise exec -- ./.github/scripts/create_release_dmg.sh \
            "$APP_PATH" \
            apps/mac/build/supaterm.dmg \
            "$DEVELOPER_ID_IDENTITY_SHA"
      - name: Notarize and staple
        run: |
          set -euo pipefail
          APP_PATH=$(find apps/mac/build/export -maxdepth 3 -name 'supaterm.app' -print -quit)
          NOTARY_RESULT_PATH=apps/mac/build/notarytool-submit.json
          NOTARY_LOG_PATH=apps/mac/build/notarytool-log.json
          NOTARY_STATUS=""
          NOTARY_ID=""
          for attempt in 1 2 3; do
            echo "Notarization attempt $attempt..."
            submit_exit=0
            if ! xcrun notarytool submit apps/mac/build/supaterm.dmg \
              --keychain-profile "notarytool-profile" \
              --wait \
              --output-format json > "$NOTARY_RESULT_PATH"; then
              submit_exit=$?
            fi
            cat "$NOTARY_RESULT_PATH" || true
            NOTARY_STATUS=$(/usr/bin/python3 -c 'import json, pathlib, sys; p = pathlib.Path(sys.argv[1]); data = json.load(p.open()) if p.exists() else {}; print(data.get("status", ""))' "$NOTARY_RESULT_PATH" 2>/dev/null || true)
            NOTARY_ID=$(/usr/bin/python3 -c 'import json, pathlib, sys; p = pathlib.Path(sys.argv[1]); data = json.load(p.open()) if p.exists() else {}; print(data.get("id", ""))' "$NOTARY_RESULT_PATH" 2>/dev/null || true)
            if [ "$submit_exit" -eq 0 ] && [ "$NOTARY_STATUS" = "Accepted" ]; then
              break
            fi
            if [ -n "$NOTARY_ID" ]; then
              xcrun notarytool log "$NOTARY_ID" --keychain-profile "notarytool-profile" > "$NOTARY_LOG_PATH" || true
              cat "$NOTARY_LOG_PATH" || true
            fi
            echo "Attempt $attempt failed, retrying in 30s..."
            sleep 30
          done
          if [ "$NOTARY_STATUS" != "Accepted" ]; then
            echo "::error::Notarization failed with status '$NOTARY_STATUS'"
            exit 1
          fi
          xcrun stapler staple apps/mac/build/supaterm.dmg
          xcrun stapler staple "$APP_PATH"
          xcrun stapler validate apps/mac/build/supaterm.dmg
          xcrun stapler validate "$APP_PATH"
          spctl --assess --type execute --verbose=4 "$APP_PATH"
      - name: Create app zip
        run: |
          APP_PATH=$(find apps/mac/build/export -maxdepth 3 -name 'supaterm.app' -print -quit)
          ditto -c -k --sequesterRsrc --keepParent "$APP_PATH" apps/mac/build/supaterm.app.zip
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: dsyms
          if-no-files-found: error
          path: apps/mac/build/supaterm.xcarchive/dSYMs/**
      - name: Wait for release feed turn
        env:
          GH_TOKEN: ${{ github.token }}
        run: /usr/bin/python3 .github/scripts/wait_for_release_feed_turn.py
      - name: Generate tip appcast
        id: tip-appcast
        env:
          GH_TOKEN: ${{ github.token }}
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          STAGING=$(mktemp -d)
          trap 'rm -rf "$STAGING"' EXIT
          cp apps/mac/build/supaterm.app.zip "$STAGING/"
          printf "%s" "$SPARKLE_PRIVATE_KEY" | tr -d '\r\n\t ' | apps/Tuist/.build/artifacts/sparkle/Sparkle/bin/generate_appcast \
            --download-url-prefix "https://supaterm.com/download/tip/" \
            --maximum-versions 1 \
            --ed-key-file - "$STAGING"
          /usr/bin/python3 .github/scripts/merge_appcasts.py stamp \
            "$STAGING/appcast.xml" \
            apps/mac/build/appcast.xml \
            --release-day "$RELEASE_DAY" \
            --channel tip
          printf "%s" "$SPARKLE_PRIVATE_KEY" | tr -d '\r\n\t ' | apps/Tuist/.build/artifacts/sparkle/Sparkle/bin/sign_update \
            --ed-key-file - apps/mac/build/appcast.xml
          printf "%s" "$SPARKLE_PRIVATE_KEY" | tr -d '\r\n\t ' | apps/Tuist/.build/artifacts/sparkle/Sparkle/bin/sign_update \
            --verify --ed-key-file - apps/mac/build/appcast.xml
          LATEST_TAG=$(gh release list --exclude-drafts --exclude-pre-releases -R "${{ github.repository }}" --json tagName --jq '.[0].tagName' 2>/dev/null || true)
          if [ -z "$LATEST_TAG" ]; then
            echo "::error::No stable release found"
            exit 1
          fi
          echo "stable-tag=$LATEST_TAG" >> "$GITHUB_OUTPUT"
          gh release download "$LATEST_TAG" -p "appcast.xml" -O "$STAGING/stable.xml" -R "${{ github.repository }}"
          mkdir -p apps/mac/build/latest
          /usr/bin/python3 .github/scripts/merge_appcasts.py tip \
            "$STAGING/stable.xml" \
            apps/mac/build/appcast.xml \
            apps/mac/build/latest/appcast.xml
          printf "%s" "$SPARKLE_PRIVATE_KEY" | tr -d '\r\n\t ' | apps/Tuist/.build/artifacts/sparkle/Sparkle/bin/sign_update \
            --ed-key-file - apps/mac/build/latest/appcast.xml
          printf "%s" "$SPARKLE_PRIVATE_KEY" | tr -d '\r\n\t ' | apps/Tuist/.build/artifacts/sparkle/Sparkle/bin/sign_update \
            --verify --ed-key-file - apps/mac/build/latest/appcast.xml
      - name: Generate checksums
        run: |
          /usr/bin/python3 .github/scripts/generate_release_checksums.py tip apps/mac/build/checksums.json \
            apps/mac/build/supaterm.dmg \
            apps/mac/build/supaterm.app.zip
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: build-artifacts
          if-no-files-found: error
          path: |
            apps/mac/build/supaterm.dmg
            apps/mac/build/supaterm.app.zip
            apps/mac/build/appcast.xml
            apps/mac/build/latest/appcast.xml
            apps/mac/build/checksums.json
      - name: Force-move tip tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -fa tip -m "Latest Continuous Release" "${{ github.sha }}"
          git push --force origin tip
      - name: Update tip release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create tip --prerelease --title "Supaterm Tip" --target "${{ github.sha }}" --notes "" -R "${{ github.repository }}" 2>/dev/null || \
          gh release edit tip --prerelease --title "Supaterm Tip" --target "${{ github.sha }}" -R "${{ github.repository }}"
          gh release upload tip apps/mac/build/supaterm.dmg apps/mac/build/supaterm.app.zip apps/mac/build/appcast.xml apps/mac/build/checksums.json --clobber -R "${{ github.repository }}"
      - name: Publish latest appcast
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ steps.tip-appcast.outputs.stable-tag }}" apps/mac/build/latest/appcast.xml --clobber -R "${{ github.repository }}"

  posthog-dsym:
    runs-on: ubuntu-latest
    needs: [build, ci]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - name: Resolve PostHog credentials
        id: posthog-credentials
        env:
          POSTHOG_CLI_API_KEY: ${{ secrets.POSTHOG_CLI_API_KEY }}
          POSTHOG_CLI_PROJECT_ID: ${{ secrets.POSTHOG_CLI_PROJECT_ID }}
        run: |
          if [ -n "$POSTHOG_CLI_PROJECT_ID" ] && [ -n "$POSTHOG_CLI_API_KEY" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ -z "$POSTHOG_CLI_PROJECT_ID" ] && [ -z "$POSTHOG_CLI_API_KEY" ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "::error::POSTHOG_CLI_PROJECT_ID and POSTHOG_CLI_API_KEY must be configured together"
          exit 1
      - name: Install posthog-cli
        if: steps.posthog-credentials.outputs.enabled == 'true'
        run: .github/scripts/install_posthog_cli.sh
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        if: steps.posthog-credentials.outputs.enabled == 'true'
        with:
          name: dsyms
          path: dsyms
      - name: Upload dSYMs to PostHog
        if: steps.posthog-credentials.outputs.enabled == 'true'
        env:
          POSTHOG_CLI_API_KEY: ${{ secrets.POSTHOG_CLI_API_KEY }}
          POSTHOG_CLI_HOST: https://us.posthog.com
          POSTHOG_CLI_PROJECT_ID: ${{ secrets.POSTHOG_CLI_PROJECT_ID }}
        run: |
          set -euo pipefail
          test -n "$POSTHOG_CLI_PROJECT_ID"
          test -n "$POSTHOG_CLI_API_KEY"
          MARKETING_VERSION=$(sed -n 's/^MARKETING_VERSION *= *//p' apps/Configurations/Versions.xcconfig)
          posthog-cli dsym upload \
            --directory dsyms \
            --project app.supabit.supaterm \
            --version "$MARKETING_VERSION" \
            --build "${{ needs.build.outputs.build-number }}"
