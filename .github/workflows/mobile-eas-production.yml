name: Mobile Production

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "build (auto-upload to TestFlight / Play testing) or update (OTA)"
        required: true
        type: choice
        default: build
        options:
          - build
          - update
      platform:
        description: "Target platform"
        required: true
        type: choice
        default: all
        options:
          - ios
          - android
          - all
      version:
        description: "Optional build version override (blank uses app.config.ts; an override is committed before building)"
        required: false
        type: string
      message:
        description: "OTA update message (mode=update only)"
        required: false
        type: string
  push:
    branches: [main]
    paths:
      - apps/mobile/**
      - packages/client-runtime/**
      - packages/contracts/**
      - packages/shared/**
      - assets/**
      - scripts/**
      - patches/**
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - .github/workflows/mobile-eas-production.yml
      - .github/actions/setup-mobile-release/**
      - .github/actions/build-mobile/**
      - .github/scripts/mobile-build-*.cjs
      - .github/scripts/mobile-store-*.mjs

concurrency:
  group: mobile-eas-production
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare mobile release
    runs-on: depot-ubuntu-24.04-8
    timeout-minutes: 10
    environment: ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'build' && inputs.version != '' && 'release' || '' }}
    outputs:
      enabled: ${{ steps.expo-token.outputs.present }}
      sha: ${{ steps.source.outputs.sha }}
      matrix: ${{ steps.source.outputs.matrix }}
    permissions:
      contents: read
    env:
      APP_VARIANT: production
      NODE_OPTIONS: --max-old-space-size=8192
    steps:
      - id: expo-token
        name: Check for EXPO_TOKEN
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [ -n "$EXPO_TOKEN" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "EXPO_TOKEN is not available; skipping EAS production job."
          fi

      - name: Checkout
        if: steps.expo-token.outputs.present == 'true'
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Mise
        if: steps.expo-token.outputs.present == 'true'
        uses: ./.github/actions/setup-mise
        with:
          cache: false

      - name: Load release App credentials for version override
        if: steps.expo-token.outputs.present == 'true' && github.event_name == 'workflow_dispatch' && inputs.mode == 'build' && inputs.version != ''
        uses: ./.github/actions/load-release-secrets
        with:
          profile: release-app
          service-account-token: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}

      - id: version_app_token
        name: Mint release app token for version override
        if: steps.expo-token.outputs.present == 'true' && github.event_name == 'workflow_dispatch' && inputs.mode == 'build' && inputs.version != ''
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ env.RELEASE_APP_ID }}
          private-key: ${{ env.RELEASE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write

      - name: Checkout with version override push credentials
        if: steps.version_app_token.outcome == 'success'
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ steps.version_app_token.outputs.token }}

      - name: Apply manual version override
        if: steps.version_app_token.outcome == 'success'
        env:
          GH_TOKEN: ${{ steps.version_app_token.outputs.token }}
          APP_SLUG: ${{ steps.version_app_token.outputs.app-slug }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          if [ "$GITHUB_REF_TYPE" != "branch" ]; then
            echo "Version overrides require dispatching this workflow from a branch; received $GITHUB_REF_TYPE '$GITHUB_REF_NAME'." >&2
            exit 1
          fi
          if ! [[ "$RELEASE_VERSION" =~ ^[0-9]+(\.[0-9]+){1,2}$ ]]; then
            echo "Version override must contain two or three dot-separated integers; received '$RELEASE_VERSION'." >&2
            exit 1
          fi

          node --input-type=module -e '
            import fs from "node:fs";
            const path = "apps/mobile/app.config.ts";
            const source = fs.readFileSync(path, "utf8");
            const next = source.replace(
              /^(  version: ")[^"]+(".*)$/m,
              (_match, prefix, suffix) => prefix + process.env.RELEASE_VERSION + suffix,
            );
            if (next === source && !source.includes("  version: \"" + process.env.RELEASE_VERSION + "\"")) {
              throw new Error("Could not update app version");
            }
            fs.writeFileSync(path, next);
          '

          if git diff --quiet -- apps/mobile/app.config.ts; then
            echo "app.config.ts is already at $RELEASE_VERSION; no version commit needed."
            exit 0
          fi

          user_id="$(gh api "/users/${APP_SLUG}[bot]" --jq .id)"
          git config user.name "${APP_SLUG}[bot]"
          git config user.email "${user_id}+${APP_SLUG}[bot]@users.noreply.github.com"
          git add apps/mobile/app.config.ts
          git commit \
            -m "chore(mobile): bump app version to $RELEASE_VERSION" \
            -m "Co-authored-by: codex <codex@users.noreply.github.com>"
          git push origin "HEAD:refs/heads/${GITHUB_REF_NAME}"

      - id: source
        name: Select build runners
        if: steps.expo-token.outputs.present == 'true'
        env:
          MOBILE_PLATFORM: ${{ inputs.platform || 'all' }}
        run: |
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          node --input-type=module -e '
            import fs from "node:fs";
            const include = [
              { platform: "ios", runner: "xcode-27" },
              { platform: "android", runner: "depot-ubuntu-24.04-8" },
            ].filter(({ platform }) =>
              process.env.MOBILE_PLATFORM === "all" || platform === process.env.MOBILE_PLATFORM);
            fs.appendFileSync(process.env.GITHUB_OUTPUT, "matrix=" + JSON.stringify({ include }) + "\n");
          '

  production:
    name: Mobile ${{ matrix.platform }} production
    needs: prepare
    if: needs.prepare.outputs.enabled == 'true'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    permissions:
      contents: read
      deployments: write
    env:
      APP_VARIANT: production
      NODE_OPTIONS: --max-old-space-size=8192
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      MOBILE_PLATFORM: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          ref: ${{ needs.prepare.outputs.sha }}
          fetch-depth: 0
      - uses: ./.github/actions/setup-mobile-release
        with:
          token: ${{ secrets.EXPO_TOKEN }}
          environment: production
          cache: false
      - id: config
        name: Resolve native fingerprint and app version
        working-directory: apps/mobile
        run: |
          set -o pipefail
          version=$(npx expo config --json --type public | jq -er '.version')
          fingerprint_json=$(eas fingerprint:generate --platform "$MOBILE_PLATFORM" --environment production --json --non-interactive | sed -n '/^{/,$p')
          fingerprint=$(jq -er '.hash' <<< "$fingerprint_json")
          reason=expoAutolinkingAndroid
          if [ "$MOBILE_PLATFORM" = ios ]; then reason=expoAutolinkingIos; fi
          expo_modules=$(jq --arg reason "$reason" '[.sources[] | select((.reasons // []) | index($reason))] | length' <<< "$fingerprint_json")
          {
            echo "version=$version"
            echo "fingerprint=$fingerprint"
            echo "expo_modules=$expo_modules"
          } >> "$GITHUB_OUTPUT"
      # @expo/fingerprint swallows autolinking errors and returns no Expo module
      # sources, so native changes stop moving the hash and OTAs reach binaries
      # that lack them. Stop before any OTA from such a fingerprint.
      - name: Verify the fingerprint hashes Expo native modules
        if: github.event_name == 'push' || inputs.mode == 'update'
        env:
          EXPO_MODULES: ${{ steps.config.outputs.expo_modules }}
        run: |
          if [ "${EXPO_MODULES:-0}" -eq 0 ]; then
            echo ":x: $MOBILE_PLATFORM: the native fingerprint hashes no Expo native modules; stopped before any OTA." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
      - id: history
        name: Find completed builds
        uses: actions/github-script@v8
        env:
          MOBILE_VERSION: ${{ steps.config.outputs.version }}
          MOBILE_FINGERPRINT: ${{ steps.config.outputs.fingerprint }}
        with:
          script: |
            const { findBuilds } = require('./.github/scripts/mobile-build-history.cjs');
            const { versionBuild, compatibleBuild } = await findBuilds({
              github, context, profile: 'production', platform: process.env.MOBILE_PLATFORM,
              version: process.env.MOBILE_VERSION, fingerprint: process.env.MOBILE_FINGERPRINT,
            });
            core.setOutput('version_exists', Boolean(versionBuild));
            core.setOutput('compatible', Boolean(compatibleBuild));
      - id: build
        name: Compile and sign
        if: inputs.mode == 'build' || (github.event_name == 'push' && steps.history.outputs.version_exists != 'true')
        uses: ./.github/actions/build-mobile
        with:
          platform: ${{ matrix.platform }}
          profile: production
      - id: artifact
        name: Save signed binary
        if: steps.build.outcome == 'success'
        uses: actions/upload-artifact@v7
        with:
          name: mobile-production-${{ matrix.platform }}-${{ github.run_attempt }}
          path: ${{ steps.build.outputs.binary }}
          if-no-files-found: error
          retention-days: 14
      - name: Upload signed binary to TestFlight or Play testing
        if: steps.build.outcome == 'success'
        working-directory: apps/mobile
        env:
          MOBILE_BINARY: ${{ steps.build.outputs.binary }}
        run: eas submit --platform "$MOBILE_PLATFORM" --profile production --path "$MOBILE_BINARY" --non-interactive --wait
      - name: Record exact production binary identity
        if: steps.build.outcome == 'success'
        env:
          MOBILE_BINARY: ${{ steps.build.outputs.binary }}
          MOBILE_VERSION: ${{ steps.config.outputs.version }}
          MOBILE_SOURCE_SHA: ${{ needs.prepare.outputs.sha }}
          MOBILE_BUILD_MANIFEST: ${{ runner.temp }}/mobile-store-build/manifest.json
          BUNDLETOOL_PATH: ${{ runner.temp }}/bundletool.jar
        run: |
          mkdir -p "$(dirname "$MOBILE_BUILD_MANIFEST")"
          if [ "$MOBILE_PLATFORM" = android ]; then
            curl --fail --location --retry 3 \
              https://github.com/google/bundletool/releases/download/1.18.3/bundletool-all-1.18.3.jar \
              --output "$BUNDLETOOL_PATH"
          fi
          node .github/scripts/mobile-store-release.mjs create
      - name: Save production build identity
        if: steps.build.outcome == 'success'
        uses: actions/upload-artifact@v7
        with:
          name: mobile-store-build-${{ matrix.platform }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/mobile-store-build/manifest.json
          if-no-files-found: error
          retention-days: 14
      - name: Show optional store review inputs
        if: steps.build.outcome == 'success' && github.ref == 'refs/heads/main'
        env:
          MOBILE_SOURCE_SHA: ${{ needs.prepare.outputs.sha }}
        run: |
          {
            echo "### Optional store review"
            echo
            echo "Dispatch [Mobile Store Review]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/workflows/mobile-store-review.yml) on \`main\` to submit this build:"
            echo
            echo "- \`platform\`: \`$MOBILE_PLATFORM\`"
            echo "- \`build_run_id\`: \`$GITHUB_RUN_ID\`"
            echo "- \`source_sha\`: \`$MOBILE_SOURCE_SHA\`"
            echo
            echo "Build artifacts are available for 14 days."
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Record completed store build
        if: steps.build.outcome == 'success'
        uses: actions/github-script@v8
        env:
          MOBILE_VERSION: ${{ steps.config.outputs.version }}
          MOBILE_FINGERPRINT: ${{ steps.build.outputs.fingerprint }}
          MOBILE_SOURCE_SHA: ${{ needs.prepare.outputs.sha }}
          MOBILE_ARTIFACT_URL: ${{ steps.artifact.outputs.artifact-url }}
        with:
          script: |
            const { recordBuild } = require('./.github/scripts/mobile-build-history.cjs');
            await recordBuild({
              github, context, profile: 'production', platform: process.env.MOBILE_PLATFORM,
              version: process.env.MOBILE_VERSION, fingerprint: process.env.MOBILE_FINGERPRINT,
              sha: process.env.MOBILE_SOURCE_SHA, url: process.env.MOBILE_ARTIFACT_URL,
            });
      - name: Publish compatible OTA update
        if: github.event_name == 'push' || inputs.mode == 'update'
        working-directory: apps/mobile
        env:
          MOBILE_FINGERPRINT: ${{ steps.config.outputs.fingerprint }}
          BUILT_FINGERPRINT: ${{ steps.build.outputs.fingerprint }}
          COMPATIBLE_BUILD_EXISTS: ${{ steps.history.outputs.compatible }}
          UPDATE_MESSAGE: ${{ inputs.message }}
        run: |
          if [ "$COMPATIBLE_BUILD_EXISTS" != true ] && [ "$BUILT_FINGERPRINT" != "$MOBILE_FINGERPRINT" ]; then
            echo "$MOBILE_PLATFORM: no completed build matches $MOBILE_FINGERPRINT; OTA skipped." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          message="${UPDATE_MESSAGE:-$(git log -1 --pretty=%s | head -c 120) ($(git rev-parse --short=9 HEAD))}"
          eas update --channel production --environment production --platform "$MOBILE_PLATFORM" \
            --message "$message" --non-interactive
