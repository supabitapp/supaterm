name: deploy-web

on:
  push:
    branches:
      - main
    paths:
      - "apps/supaterm.com/**"
      - ".github/workflows/deploy-web.yml"
      - "Makefile"
      - "mise.toml"
  pull_request:
    branches:
      - main
    paths:
      - "apps/supaterm.com/**"
      - ".github/workflows/deploy-web.yml"
      - "Makefile"
      - "mise.toml"
  workflow_dispatch: {}

concurrency:
  group: deploy-web-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  web:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          lfs: true
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c
        env:
          MISE_NO_HOOKS: "1"
        with:
          version: 2026.3.0
          cache: true
          install_args: pnpm
      - name: Resolve Vite+ version
        id: vite_plus
        shell: bash
        run: |
          VERSION=$(node -e 'const fs = require("fs"); const lock = fs.readFileSync("apps/supaterm.com/pnpm-lock.yaml", "utf8"); const match = lock.match(/\n  vite-plus@([0-9][^:]+):/); if (!match) throw new Error("Unable to resolve vite-plus version from apps/supaterm.com/pnpm-lock.yaml"); process.stdout.write(match[1]);')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - name: Install Vite+
        run: npm install --global "vite-plus@${{ steps.vite_plus.outputs.version }}"
      - run: make web-install
      - run: make web-check
      - run: make web-test
      - name: Audit production dependencies
        run: cd apps/supaterm.com && pnpm audit --prod --audit-level high
      - run: make web-build
      - name: Deploy Worker
        if: github.event_name == 'workflow_dispatch' || github.event_name == 'push'
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/supaterm.com
          command: deploy
