name: Mobile Store Automation Checks

on:
  pull_request:
    paths:
      - .github/scripts/*play-credentials*
      - .github/scripts/mobile-store-*
      - .github/workflows/mobile-*.yml
      - apps/mobile/Gemfile*
      - apps/mobile/fastlane/**
      - scripts/mobile-store-*
      - scripts/mobile-showcase*
  push:
    branches: [main]
    paths:
      - .github/scripts/*play-credentials*
      - .github/scripts/mobile-store-*
      - .github/workflows/mobile-*.yml
      - apps/mobile/Gemfile*
      - apps/mobile/fastlane/**
      - scripts/mobile-store-*
      - scripts/mobile-showcase*

permissions:
  contents: read

concurrency:
  group: mobile-store-review-check-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    runs-on: depot-ubuntu-24.04-4
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-mise
      - name: Install screenshot tooling
        run: mise exec -- vp install --filter=@supaterm/scripts...
      - uses: ruby/setup-ruby@651ff0d62c5c79bed6d53ec518387aae20e72c1a # v1.329.0
        with:
          ruby-version: "3.4.8"
          working-directory: apps/mobile
          bundler-cache: true
      - name: Test exact build selection and credential export
        run: node --test .github/scripts/mobile-store-release.test.mjs .github/scripts/export-play-credentials.test.mjs
      - name: Test screenshot validation
        run: vp test run scripts/mobile-showcase.test.ts scripts/mobile-store-assets.test.ts
      - name: Test review behavior and load pinned Fastlane lanes
        working-directory: apps/mobile
        env:
          FASTLANE_SKIP_UPDATE_CHECK: "true"
        run: |
          ruby fastlane/review.test.rb
          bundle exec ruby fastlane/play-review-commit.test.rb
          bundle exec fastlane lanes
