name: Release desktop build

# One desktop platform/arch build, called once per target from release.yml so
# each target is its own job with its own `needs`. The JS bundle (server, web
# client, Electron main) comes from the `js-bundle` artifact that build_bundle
# produced; this job only packages it, builds the native helpers, and, where
# `cli_archive` is set, the self-contained CLI archive for its platform.

on:
  workflow_call:
    secrets:
      OP_SERVICE_ACCOUNT_TOKEN:
        required: false
      MACOS_PROVISIONING_PROFILE:
        required: false
      AZURE_TENANT_ID:
        required: false
      AZURE_CLIENT_ID:
        required: false
      AZURE_CLIENT_SECRET:
        required: false
      AZURE_TRUSTED_SIGNING_ENDPOINT:
        required: false
      AZURE_TRUSTED_SIGNING_ACCOUNT_NAME:
        required: false
      AZURE_TRUSTED_SIGNING_CERTIFICATE_PROFILE_NAME:
        required: false
      AZURE_TRUSTED_SIGNING_PUBLISHER_NAME:
        required: false
    inputs:
      label:
        required: true
        type: string
      runner:
        required: true
        type: string
      platform:
        required: true
        type: string
      target:
        required: true
        type: string
      arch:
        required: true
        type: string
      rust_target:
        required: true
        type: string
      resource_key:
        required: true
        type: string
      # Whether the job also builds the self-contained CLI archive for its own
      # platform/arch, on this runner, and smoke-tests it here. Every archive
      # is built on hardware of its own architecture.
      cli_archive:
        required: false
        default: false
        type: boolean
      # A runner of the target's own platform and architecture, for a `runner`
      # that cannot execute the target. The build job skips everything that
      # runs the packaged binaries, and a second job runs it there.
      verify_runner:
        required: false
        default: ""
        type: string
      version:
        required: true
        type: string
      ref:
        required: true
        type: string
      release_channel:
        required: true
        type: string

permissions:
  # Windows builds read this run's artifact list to wait for the Linux CLI archive.
  actions: read
  contents: read

jobs:
  build:
    name: Build ${{ inputs.label }}
    environment: release
    runs-on: ${{ inputs.runner }}
    # Windows waits for the Linux CLI archive inside its own budget (see
    # "Wait for Linux CLI archive"), so it gets that wait on top of the usual 30.
    timeout-minutes: ${{ inputs.platform == 'win' && 70 || 30 }}
    env:
      INPUTS_PLATFORM: ${{ inputs.platform }}
      INPUTS_TARGET: ${{ inputs.target }}
      INPUTS_ARCH: ${{ inputs.arch }}
      INPUTS_RUST_TARGET: ${{ inputs.rust_target }}
      INPUTS_RESOURCE_KEY: ${{ inputs.resource_key }}
      INPUTS_VERSION: ${{ inputs.version }}
      INPUTS_RELEASE_CHANNEL: ${{ inputs.release_channel }}
      INPUTS_VERIFY_RUNNER: ${{ inputs.verify_runner }}
    steps:
      # This repository is public, so Git needs no credentials. checkout's
      # credential cleanup runs submodule foreach even with submodules disabled,
      # which fails on the orphaned gitlinks in our vendored .repos tree.
      # checkout.workers=0 writes the files on every core. Alternating both ways
      # in one job on the Windows runners, it wrote the files about 10s faster
      # (about 40% on arm64).
      - name: Checkout
        shell: bash
        env:
          CHECKOUT_REF: ${{ inputs.ref }}
          GIT_TERMINAL_PROMPT: "0"
        run: |
          set -euo pipefail
          git init .
          git remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
          git fetch --no-tags --depth=1 origin "$CHECKOUT_REF"
          git -c checkout.workers=0 checkout --detach FETCH_HEAD

      - name: Setup Mise
        uses: ./.github/actions/setup-mise
        with:
          cache: false
      - name: Select Xcode 27.1
        if: inputs.platform == 'mac'
        shell: bash
        env:
          DEVELOPER_DIR: /Applications/Xcode_27.1.app/Contents/Developer
        run: |
          xcodebuild -version
          xcrun --find actool
          echo "DEVELOPER_DIR=$DEVELOPER_DIR" >> "$GITHUB_ENV"
      # pnpm checks the lockfile and policy before reusing this result. A missing
      # artifact leaves the cache empty, so installation runs the checks again.
      - name: Download dependency verification
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: release-dependency-verification
          path: ${{ runner.temp }}/pnpm-metadata

      # Windows installs straight from the registry. There, linking the packages
      # takes the time, not downloading them, so a ~700 MB package cache did not
      # pay for its own restore. Across recent nightlies, restore plus install
      # took 183-233s on arm64 and 116-172s on x64, while a plain install took
      # 142-210s and 84-160s. The arm64 entries also filled 4 GB of the
      # repository's 10 GB Actions cache.
      - name: Install desktop dependencies
        env:
          pnpm_config_cache_dir: ${{ runner.temp }}/pnpm-metadata
        run: vp install --filter=@supaterm/desktop... --filter=supaterm... --filter=@supaterm/scripts...

      - name: Cache resource monitor
        id: resource_monitor_cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: native/resource-monitor/target/${{ inputs.rust_target }}/release/supaterm-resource-monitor${{ inputs.platform == 'win' && '.exe' || '' }}
          key: resource-monitor-${{ inputs.rust_target }}-${{ hashFiles('native/resource-monitor/Cargo.lock', 'native/resource-monitor/Cargo.toml', 'native/resource-monitor/src/**') }}

      - name: Cache Linux capture helpers
        if: inputs.platform == 'linux'
        id: capture_helper_cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            native/kde-snap-shot/target/${{ inputs.rust_target }}/release/supaterm-kde-snap-shot
            native/hyprland-snap-shot/target/${{ inputs.rust_target }}/release/supaterm-hyprland-snap-shot
          key: linux-capture-helpers-${{ inputs.rust_target }}-${{ hashFiles('native/kde-snap-shot/Cargo.lock', 'native/kde-snap-shot/Cargo.toml', 'native/kde-snap-shot/src/**', 'native/hyprland-snap-shot/Cargo.lock', 'native/hyprland-snap-shot/Cargo.toml', 'native/hyprland-snap-shot/src/**', 'native/hyprland-snap-shot/protocols/**') }}

      - name: Setup Rust
        if: steps.resource_monitor_cache.outputs.cache-hit != 'true' || (inputs.platform == 'linux' && steps.capture_helper_cache.outputs.cache-hit != 'true')
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
          targets: ${{ inputs.rust_target }}

      - name: Align package versions to release version
        shell: bash
        run: node scripts/update-release-package-versions.ts "$INPUTS_VERSION"

      # The artifact root is `apps/` (upload-artifact keeps the least common
      # ancestor of its paths), so extracting into `apps` restores
      # apps/server/dist and apps/desktop/dist-electron at their build paths.
      - name: Download JS bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: js-bundle
          path: apps

      # Only the resource monitor build needs these libraries. With a cached
      # monitor, the desktop build's preflight skips its MSVC check, and node-pty
      # ships prebuilt Windows binaries, so the 30-60s install is skipped too.
      - name: Install Spectre-mitigated MSVC libs
        if: runner.os == 'Windows' && steps.resource_monitor_cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $installPath = & $vswhere -products * -latest -property installationPath
          $setupExe = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\setup.exe"
          $proc = Start-Process -FilePath $setupExe `
            -ArgumentList "modify", "--installPath", "`"$installPath`"", "--add", `
            "Microsoft.VisualStudio.Component.VC.Runtimes.${{ inputs.arch == 'arm64' && 'ARM64' || 'x86.x64' }}.Spectre", "--quiet", "--norestart" `
            -Wait -PassThru -NoNewWindow
          if ($null -eq $proc -or $proc.ExitCode -ne 0) {
            $code = if ($null -ne $proc) { $proc.ExitCode } else { 1 }
            Write-Error "Visual Studio Installer failed with exit code $code"
            exit $code
          }

      - name: Install cargo-xwin
        if: runner.os != 'Windows' && inputs.platform == 'win' && steps.resource_monitor_cache.outputs.cache-hit != 'true'
        uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2
        with:
          tool: cargo-xwin@0.23.1

      # Built here rather than inside the desktop build so the CLI archive,
      # which bundles the same binary, can be built and uploaded first.
      - name: Build resource monitor
        if: steps.resource_monitor_cache.outputs.cache-hit != 'true'
        shell: bash
        run: cargo ${{ runner.os != 'Windows' && inputs.platform == 'win' && 'xwin build' || 'build' }} --locked --release --manifest-path native/resource-monitor/Cargo.toml --target "${INPUTS_RUST_TARGET}"

      - name: Prepare Azure Trusted Signing
        if: inputs.platform == 'win' && runner.os == 'Windows'
        shell: pwsh
        env:
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_TRUSTED_SIGNING_ENDPOINT: ${{ secrets.AZURE_TRUSTED_SIGNING_ENDPOINT }}
          AZURE_TRUSTED_SIGNING_ACCOUNT_NAME: ${{ secrets.AZURE_TRUSTED_SIGNING_ACCOUNT_NAME }}
          AZURE_TRUSTED_SIGNING_CERTIFICATE_PROFILE_NAME: ${{ secrets.AZURE_TRUSTED_SIGNING_CERTIFICATE_PROFILE_NAME }}
          AZURE_TRUSTED_SIGNING_PUBLISHER_NAME: ${{ secrets.AZURE_TRUSTED_SIGNING_PUBLISHER_NAME }}
        run: |
          $ErrorActionPreference = "Stop"

          $requiredSecrets = @(
            $env:AZURE_TENANT_ID,
            $env:AZURE_CLIENT_ID,
            $env:AZURE_CLIENT_SECRET,
            $env:AZURE_TRUSTED_SIGNING_ENDPOINT,
            $env:AZURE_TRUSTED_SIGNING_ACCOUNT_NAME,
            $env:AZURE_TRUSTED_SIGNING_CERTIFICATE_PROFILE_NAME,
            $env:AZURE_TRUSTED_SIGNING_PUBLISHER_NAME
          )
          if ($requiredSecrets | Where-Object { [string]::IsNullOrWhiteSpace($_) }) {
            Write-Host "Azure Trusted Signing disabled; skipping TrustedSigning module preparation."
            exit 0
          }

          try {
            Install-PackageProvider `
              -Name NuGet `
              -MinimumVersion 2.8.5.201 `
              -Force `
              -Scope CurrentUser `
              -ErrorAction Stop
          } catch {
            Write-Warning "Could not bootstrap NuGet package provider. Continuing because the runner may already have a usable provider. $($_.Exception.Message)"
          }

          Install-Module `
            -Name TrustedSigning `
            -MinimumVersion 0.5.0 `
            -Force `
            -AllowClobber `
            -Repository PSGallery `
            -Scope CurrentUser `
            -ErrorAction Stop

          Import-Module TrustedSigning -MinimumVersion 0.5.0 -Force
          Get-Command Invoke-TrustedSigning -ErrorAction Stop

          $moduleRoots = @(
            [System.IO.Path]::Combine([Environment]::GetFolderPath("MyDocuments"), "PowerShell", "Modules"),
            [System.IO.Path]::Combine([Environment]::GetFolderPath("MyDocuments"), "WindowsPowerShell", "Modules"),
            [System.IO.Path]::Combine($env:ProgramFiles, "PowerShell", "Modules"),
            [System.IO.Path]::Combine($env:ProgramFiles, "WindowsPowerShell", "Modules")
          )
          $modulePathEntries = @($moduleRoots + ($env:PSModulePath -split ";")) |
            Where-Object { $_ -and (Test-Path $_) } |
            Select-Object -Unique
          "PSModulePath=$($modulePathEntries -join ';')" >> $env:GITHUB_ENV

      # Off Windows, scripts/lib/windows-jsign.ts signs through jsign instead of
      # the TrustedSigning PowerShell module.
      - name: Install jsign
        if: inputs.platform == 'win' && runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/jsign"
          mkdir -p "$dir"
          curl -fsSL --retry 3 -o "$dir/jsign.jar" https://github.com/ebourg/jsign/releases/download/7.6/jsign-7.6.jar
          echo "6cf58aa080e7ff82656f320cff8d4a3bff30408df8766806dcba3740dd839fa5  $dir/jsign.jar" | sha256sum -c -
          printf '#!/bin/sh\nexec java -jar "%s" "$@"\n' "$dir/jsign.jar" > "$dir/jsign"
          chmod +x "$dir/jsign"
          echo "SUPATERM_JSIGN=$dir/jsign" >> "$GITHUB_ENV"

      # The desktop build applies the same branding to apps/server/dist/client
      # (resolveDesktopWebAssetBrand in scripts/build-desktop-artifact.ts); the
      # CLI archive below ships that client and is now built first.
      - name: Apply web client branding
        if: inputs.cli_archive
        shell: bash
        run: |
          brand=production
          if [[ "${INPUTS_VERSION}" =~ -nightly\.[0-9]{8}\.[0-9]+$ ]]; then brand=nightly; fi
          node scripts/apply-web-brand-assets.ts "$brand" apps/server/dist/client

      # The single-executable is built with a Node that supports --build-sea
      # (25.7+); the repo itself stays on the engines.node version. A native
      # build injects into the runner's own Node: tsdown's cross-target download
      # path runs `tar` on a drive-letter path on Windows, which GNU tar reads as
      # a remote host. Off Windows, a Windows target downloads its node.exe.
      - name: Load Apple signing credentials
        if: inputs.platform == 'mac'
        uses: ./.github/actions/load-release-secrets
        with:
          profile: apple
          service-account-token: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}

      - name: Build CLI single-executable
        if: inputs.cli_archive
        shell: bash
        env:
          # The exact version, not a major: vp downloads it from nodejs.org/dist on
          # the runner, and only exact versions have a dist directory. Keep in
          # step with SEA_NODE_VERSION in apps/server/vite.config.ts.
          VP_NODE_VERSION: "26.12.1"
          # The executable bundles the server again, so it needs the same stamp
          # as release.yml's JS bundle.
          SUPATERM_TELEMETRY_CHANNEL: ${{ github.repository == 'supabitapp/supaterm' && inputs.release_channel || 'dev' }}
        run: |
          args=(build-exe --verbose)
          if [[ "$RUNNER_OS" != "Windows" && "$INPUTS_PLATFORM" == "win" ]]; then
            args+=(--target "win-$INPUTS_ARCH")
          fi
          node apps/server/scripts/cli.ts "${args[@]}"

      - name: Import macOS signing certificate for the CLI archive
        if: inputs.cli_archive && inputs.platform == 'mac'
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$CSC_LINK" || -z "$CSC_KEY_PASSWORD" ]]; then
            echo "macOS CLI signing disabled (missing CSC_LINK); the archive is signed ad hoc."
            exit 0
          fi
          keychain="$RUNNER_TEMP/supaterm-cli-signing.keychain-db"
          keychain_password="$(openssl rand -hex 16)"
          cert_path="$RUNNER_TEMP/supaterm-cli-signing.p12"
          printf '%s' "$CSC_LINK" | base64 --decode > "$cert_path"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$cert_path" -k "$keychain" -P "$CSC_KEY_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$keychain_password" "$keychain" >/dev/null
          existing_keychains=()
          while IFS= read -r existing_keychain; do
            existing_keychains+=("$existing_keychain")
          done < <(security list-keychains -d user | sed -E 's/^[[:space:]]*"//; s/"[[:space:]]*$//')
          security list-keychains -d user -s "$keychain" "${existing_keychains[@]}"
          identity="$(security find-identity -v -p codesigning "$keychain" | sed -n 's/.*"\(Developer ID Application: [^"]*\)".*/\1/p' | head -n 1)"
          if [[ -z "$identity" ]]; then
            echo "No Developer ID Application identity found in CSC_LINK." >&2
            exit 1
          fi
          echo "::add-mask::$keychain_password"
          echo "SUPATERM_CLI_MAC_SIGN_IDENTITY=$identity" >> "$GITHUB_ENV"
          echo "macOS CLI signing enabled."

      - name: Stage resource monitor for the CLI archive
        if: inputs.cli_archive
        shell: bash
        run: |
          set -euo pipefail
          binary_name="supaterm-resource-monitor"
          if [[ "${INPUTS_PLATFORM}" == "win" ]]; then
            binary_name="${binary_name}.exe"
          fi
          target_dir="$RUNNER_TEMP/cli-resource-monitor/${INPUTS_RESOURCE_KEY}"
          mkdir -p "$target_dir"
          cp "native/resource-monitor/target/${INPUTS_RUST_TARGET}/release/${binary_name}" "$target_dir/$binary_name"

      - name: Build CLI archive
        if: inputs.cli_archive
        shell: bash
        env:
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_TRUSTED_SIGNING_ENDPOINT: ${{ secrets.AZURE_TRUSTED_SIGNING_ENDPOINT }}
          AZURE_TRUSTED_SIGNING_ACCOUNT_NAME: ${{ secrets.AZURE_TRUSTED_SIGNING_ACCOUNT_NAME }}
          AZURE_TRUSTED_SIGNING_CERTIFICATE_PROFILE_NAME: ${{ secrets.AZURE_TRUSTED_SIGNING_CERTIFICATE_PROFILE_NAME }}
        run: |
          set -euo pipefail
          if [[ "${INPUTS_PLATFORM}" == "mac" && -n "${APPLE_API_KEY:-}" ]]; then
            key_path="$RUNNER_TEMP/AuthKey_cli_${APPLE_API_KEY_ID}.p8"
            printf '%s' "$APPLE_API_KEY" > "$key_path"
            export APPLE_API_KEY="$key_path"
          fi
          node scripts/build-cli-archive.ts \
            --platform "${INPUTS_PLATFORM}" \
            --arch "${INPUTS_ARCH}" \
            --version "${INPUTS_VERSION}" \
            --resource-monitor-dir "$RUNNER_TEMP/cli-resource-monitor" \
            --output-dir release-cli

      - name: Smoke-test CLI archive
        if: inputs.cli_archive && inputs.verify_runner == ''
        shell: bash
        run: node scripts/smoke-cli-archive.ts --archive release-cli/* --expect-version "${INPUTS_VERSION}"

      - name: Upload CLI archive
        if: inputs.cli_archive
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: cli-${{ inputs.platform }}-${{ inputs.arch }}
          path: release-cli/*
          if-no-files-found: error

      - uses: ./.github/actions/setup-apt-mirrors
        if: inputs.platform == 'linux'

      - name: Install Linux desktop build libraries
        if: inputs.platform == 'linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y libsecret-1-dev libudev-dev libusb-1.0-0-dev pkg-config
          if ! command -v magick >/dev/null 2>&1 && ! command -v convert >/dev/null 2>&1; then
              sudo apt-get install -y imagemagick
          fi

          if command -v magick >/dev/null 2>&1; then
              magick -version
          else
              convert -version
          fi

      # The WSL backend runs the Linux CLI archive inside the distro, so the
      # Windows desktop embeds the same-arch archive the release attaches.
      # This job starts alongside that Linux job instead of after it, and the
      # Linux job uploads the archive partway through, so the wait is placed
      # after all other setup. It stops early if the Linux job ended without
      # uploading the archive.
      - name: Wait for Linux CLI archive
        if: inputs.platform == 'win'
        shell: node {0}
        timeout-minutes: 40
        env:
          GITHUB_TOKEN: ${{ github.token }}
          ARTIFACT: cli-linux-${{ inputs.arch }}
          LINUX_JOB: Build Linux ${{ inputs.arch }}
        run: |
          const { setTimeout: delay } = require("node:timers/promises");
          const { GITHUB_TOKEN, GITHUB_API_URL, GITHUB_REPOSITORY, GITHUB_RUN_ID, GITHUB_RUN_ATTEMPT, ARTIFACT, LINUX_JOB } = process.env;
          const run = `${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}`;
          const read = async (path) => {
            const response = await fetch(`${run}/${path}`, {
              headers: { Authorization: `Bearer ${GITHUB_TOKEN}`, Accept: "application/vnd.github+json" },
              signal: AbortSignal.timeout(30_000),
            });
            if (!response.ok) throw new Error(`GitHub returned ${response.status}`);
            return response.json();
          };
          const hasArchive = async () => (await read(`artifacts?name=${encodeURIComponent(ARTIFACT)}`)).total_count > 0;
          async function waitForArchive() {
            let missingSince = null;
            while (true) {
              try {
                if (await hasArchive()) return console.log(`${ARTIFACT} is ready.`);
                const { jobs } = await read(`attempts/${GITHUB_RUN_ATTEMPT}/jobs?per_page=100`);
                const linux = jobs.find((job) => job.name.endsWith(LINUX_JOB));
                if (!linux) {
                  missingSince ??= Date.now();
                  if (Date.now() - missingSince >= 5 * 60_000) {
                    console.error(`::error::No job named '${LINUX_JOB}' in this run.`);
                    process.exitCode = 1;
                    return;
                  }
                } else if (linux.conclusion) {
                  if (await hasArchive()) return console.log(`${ARTIFACT} is ready.`);
                  console.error(`::error::${LINUX_JOB} ended (${linux.conclusion}) without uploading ${ARTIFACT}.`);
                  process.exitCode = 1;
                  return;
                }
              } catch (error) {
                console.warn(`Could not read this run's artifacts or jobs: ${error.message}`);
              }
              console.log(`Waiting for ${ARTIFACT}...`);
              await delay(10_000);
            }
          }
          waitForArchive().catch((error) => { console.error(error); process.exitCode = 1; });

      - name: Download Linux CLI archive for WSL
        if: inputs.platform == 'win'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: cli-linux-${{ inputs.arch }}
          path: wsl-runtime

      - name: Prepare optional Touch ID provisioning profile
        if: inputs.platform == 'mac'
        shell: bash
        env:
          MACOS_PROVISIONING_PROFILE: ${{ secrets.MACOS_PROVISIONING_PROFILE }}
        run: |
          if [[ -n "$MACOS_PROVISIONING_PROFILE" ]]; then
            profile_path="$RUNNER_TEMP/supaterm.provisionprofile"
            printf '%s' "$MACOS_PROVISIONING_PROFILE" | base64 --decode > "$profile_path"
            chmod 600 "$profile_path"
            echo "SUPATERM_MACOS_PROVISIONING_PROFILE=$profile_path" >> "$GITHUB_ENV"
          fi

      - name: Build desktop artifact
        shell: bash
        env:
          pnpm_config_cache_dir: ${{ runner.temp }}/pnpm-metadata
          SUPATERM_DESKTOP_REUSE_RESOURCE_MONITOR: true
          SUPATERM_DESKTOP_REUSE_LINUX_CAPTURE_HELPERS: ${{ steps.capture_helper_cache.outputs.cache-hit == 'true' }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_TRUSTED_SIGNING_ENDPOINT: ${{ secrets.AZURE_TRUSTED_SIGNING_ENDPOINT }}
          AZURE_TRUSTED_SIGNING_ACCOUNT_NAME: ${{ secrets.AZURE_TRUSTED_SIGNING_ACCOUNT_NAME }}
          AZURE_TRUSTED_SIGNING_CERTIFICATE_PROFILE_NAME: ${{ secrets.AZURE_TRUSTED_SIGNING_CERTIFICATE_PROFILE_NAME }}
          AZURE_TRUSTED_SIGNING_PUBLISHER_NAME: ${{ secrets.AZURE_TRUSTED_SIGNING_PUBLISHER_NAME }}
        run: |
          args=(
            --platform "${INPUTS_PLATFORM}"
            --target "${INPUTS_TARGET}"
            --arch "${INPUTS_ARCH}"
            --build-version "${INPUTS_VERSION}"
            --skip-build
            --verbose
          )
          if [[ -n "${INPUTS_VERIFY_RUNNER}" ]]; then
            args+=(--keep-stage)
          fi

          has_all() {
            for value in "$@"; do
              if [[ -z "$value" ]]; then
                return 1
              fi
            done
            return 0
          }

          if [[ "${INPUTS_PLATFORM}" == "mac" ]]; then
            if has_all "$CSC_LINK" "$CSC_KEY_PASSWORD" "$APPLE_API_KEY" "$APPLE_API_KEY_ID" "$APPLE_API_ISSUER"; then
              key_path="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY_ID}.p8"
              printf '%s' "$APPLE_API_KEY" > "$key_path"
              export APPLE_API_KEY="$key_path"

              echo "macOS signing enabled."
              args+=(--signed)
            else
              echo "macOS signing disabled (missing one or more Apple signing secrets)."
            fi
          elif [[ "${INPUTS_PLATFORM}" == "win" ]]; then
            # Embed the Linux CLI archive built by the same-arch Linux job as
            # the WSL runtime. Required for a working WSL backend on Windows.
            args+=(--wsl-runtime "$GITHUB_WORKSPACE"/wsl-runtime/supaterm-*-linux-"${INPUTS_ARCH}".tar.gz)
            if has_all \
              "$AZURE_TENANT_ID" \
              "$AZURE_CLIENT_ID" \
              "$AZURE_CLIENT_SECRET" \
              "$AZURE_TRUSTED_SIGNING_ENDPOINT" \
              "$AZURE_TRUSTED_SIGNING_ACCOUNT_NAME" \
              "$AZURE_TRUSTED_SIGNING_CERTIFICATE_PROFILE_NAME" \
              "$AZURE_TRUSTED_SIGNING_PUBLISHER_NAME"; then
              echo "Windows signing enabled (Azure Trusted Signing)."
              args+=(--signed)
            else
              echo "Windows signing disabled (missing one or more Azure Trusted Signing secrets)."
            fi
          else
            echo "Signing disabled for ${INPUTS_PLATFORM}."
          fi

          vp run dist:desktop:artifact "${args[@]}"

      # The verify job runs what this host could not: the packaged natives and
      # the CLI. Its scripts are bundled so that job needs no install.
      - name: Stage verification inputs
        if: inputs.verify_runner != ''
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p verify
          unpacked=$(ls -d "${TMPDIR:-/tmp}"/supaterm-desktop-"${INPUTS_PLATFORM}"-stage-*/app/dist/"${INPUTS_PLATFORM}"-"${INPUTS_ARCH}"-unpacked)
          tar -C "$(dirname "$unpacked")" -cf verify/unpacked.tar "$(basename "$unpacked")"
          esbuild=scripts/node_modules/.bin/esbuild
          banner="import{createRequire as __cr}from'node:module';const require=__cr(import.meta.url);"
          # build-desktop-artifact.ts's own import.meta.main guard must not run
          # its CLI inside the verify bundle.
          "$esbuild" scripts/verify-windows-desktop-artifact.ts --bundle --platform=node --format=esm \
            --target=node24 --define:import.meta.main=false --banner:js="$banner" \
            --outfile=verify/verify-windows-desktop-artifact.mjs
          "$esbuild" scripts/smoke-cli-archive.ts --bundle --platform=node --format=esm \
            --target=node24 --banner:js="$banner" --outfile=verify/smoke-cli-archive.mjs

      - name: Upload verification inputs
        if: inputs.verify_runner != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: verify-${{ inputs.platform }}-${{ inputs.arch }}
          path: verify/*
          if-no-files-found: error
          retention-days: 1
          compression-level: 1

      - name: Collect release assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-publish

          shopt -s nullglob
          patterns=(
            "release/*.dmg"
            "release/*.zip"
            "release/*.AppImage"
            "release/*.deb"
            "release/*.exe"
          )
          # Preview builds have no publish config, so electron-builder writes
          # no feed manifest for them, but it still emits blockmaps beside the
          # installers. Neither belongs on a release no updater may follow.
          if [[ "${INPUTS_RELEASE_CHANNEL}" != "preview" ]]; then
            patterns+=("release/*.blockmap" "release/*.yml")
          fi
          for pattern in "${patterns[@]}"; do
            for file in $pattern; do
              cp "$file" release-publish/
            done
          done

          if [[ "${INPUTS_PLATFORM}" == "mac" && "${INPUTS_ARCH}" != "arm64" ]]; then
            shopt -s nullglob
            for manifest in release-publish/*-mac.yml; do
              mv "$manifest" "${manifest%.yml}-${INPUTS_ARCH}.yml"
            done
          fi

          # Windows updater metadata is channel-specific (for example
          # "latest.yml" or "nightly.yml") and carries no arch, so the x64 and
          # arm64 jobs would upload the same name. Suffix each per-arch copy;
          # the release job merges them back into one manifest per channel.
          # builder-debug.yml is electron-builder's config dump, not a feed.
          if [[ "${INPUTS_PLATFORM}" == "win" ]]; then
            for manifest in release-publish/*.yml; do
              [[ "$manifest" == */builder-debug.yml ]] && continue
              mv "$manifest" "${manifest%.yml}-win-${INPUTS_ARCH}.yml"
            done
          fi

      - name: Collect resource monitor
        shell: bash
        run: |
          set -euo pipefail
          binary_name="supaterm-resource-monitor"
          if [[ "${INPUTS_PLATFORM}" == "win" ]]; then
            binary_name="${binary_name}.exe"
          fi
          source_path="native/resource-monitor/target/${INPUTS_RUST_TARGET}/release/${binary_name}"
          target_dir="resource-monitor-publish/${INPUTS_RESOURCE_KEY}"
          mkdir -p "$target_dir"
          cp "$source_path" "$target_dir/$binary_name"

      - name: Upload build artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: desktop-${{ inputs.platform }}-${{ inputs.arch }}
          path: release-publish/*
          if-no-files-found: error

      - name: Upload resource monitor
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: resource-monitor-${{ inputs.resource_key }}
          path: resource-monitor-publish/${{ inputs.resource_key }}/*
          if-no-files-found: error

  verify:
    name: Verify
    needs: [build]
    if: inputs.verify_runner != ''
    runs-on: ${{ inputs.verify_runner }}
    timeout-minutes: 15
    env:
      INPUTS_PLATFORM: ${{ inputs.platform }}
      INPUTS_ARCH: ${{ inputs.arch }}
      INPUTS_VERSION: ${{ inputs.version }}
    steps:
      - name: Download verification inputs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: verify-${{ inputs.platform }}-${{ inputs.arch }}
          path: verify

      - name: Download CLI archive
        if: inputs.cli_archive
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: cli-${{ inputs.platform }}-${{ inputs.arch }}
          path: release-cli

      - name: Verify packaged natives
        shell: bash
        run: |
          set -euo pipefail
          tar -C verify -xf verify/unpacked.tar
          node verify/verify-windows-desktop-artifact.mjs \
            --app-dir "$(cygpath -w "$PWD/verify/${INPUTS_PLATFORM}-${INPUTS_ARCH}-unpacked")" \
            --arch "${INPUTS_ARCH}" --build-version "${INPUTS_VERSION}" --verbose

      - name: Smoke-test CLI archive
        if: inputs.cli_archive
        shell: bash
        run: node verify/smoke-cli-archive.mjs --archive release-cli/* --expect-version "${INPUTS_VERSION}"

      # cargo-xwin links this binary on Linux, and nothing else runs it before users do.
      # Node rather than pwsh: PowerShell on Windows ARM crashes intermittently
      # (https://github.com/dotnet/runtime/issues/131636), which is why this
      # target stopped building on Windows.
      - name: Smoke-test resource monitor
        shell: bash
        env:
          MONITOR: verify/${{ inputs.platform }}-${{ inputs.arch }}-unpacked/resources/resource-monitor/supaterm-resource-monitor.exe
          EXPECTED_ARCH: ${{ inputs.arch == 'arm64' && 'aarch64' || 'x86_64' }}
        run: |
          node --input-type=module <<'EOF'
          import { spawn } from "node:child_process";
          const monitor = spawn(process.env.MONITOR, { stdio: ["pipe", "pipe", "inherit"] });
          monitor.stdout.setEncoding("utf8");
          let output = "";
          const exited = new Promise((resolve) => monitor.on("close", resolve));
          const hello = await new Promise((resolve, reject) => {
            monitor.on("error", reject);
            monitor.on("close", () => reject(new Error(`Resource monitor exited before hello: ${output}`)));
            monitor.stdout.on("data", (chunk) => {
              output += chunk;
              const end = output.indexOf("\n");
              if (end !== -1) resolve(JSON.parse(output.slice(0, end)));
            });
          });
          if (hello.type !== "hello" || hello.arch !== process.env.EXPECTED_ARCH) {
            throw new Error(`Unexpected hello: ${JSON.stringify(hello)}`);
          }
          const send = (message) => monitor.stdin.write(`${JSON.stringify({ version: hello.version, ...message })}\n`);
          send({ type: "configure", rootPid: process.pid, sampleIntervalMs: 1000 });
          send({ type: "sampleNow", requestId: "verify" });
          monitor.stdin.end();
          const exitCode = await exited;
          const sample = output
            .split("\n")
            .filter((line) => line.trim())
            .map((line) => JSON.parse(line))
            .find((message) => message.requestId === "verify");
          if (exitCode !== 0 || sample?.type !== "snapshot" || !sample.processes.some((p) => p.pid === process.pid)) {
            throw new Error(`Resource monitor exited ${exitCode} with: ${output}`);
          }
          console.log(`Resource monitor sampled ${sample.scannedProcessCount} processes.`);
          EOF
