name: Web Preview

# PR code builds static assets with a read-only token and no hosting secrets.
# The publish workflow on the default branch verifies trust again and deploys.
on:
  pull_request:
    types: [opened, reopened, synchronize, labeled]

permissions:
  contents: read

concurrency:
  group: web-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: ${{ github.event.action != 'labeled' || github.event.label.name == 'preview:web' }}

jobs:
  trust:
    name: Check PR author trust
    if: github.event.action != 'labeled' || github.event.label.name == 'preview:web'
    runs-on: depot-ubuntu-24.04
    timeout-minutes: 5
    outputs:
      status: ${{ steps.vouch.outputs.status }}
    steps:
      # No checkout: the action reads the vouch list from the default branch.
      - id: vouch
        uses: mitchellh/vouch/action/check-user@d66fa29a64600490892131ad87597c30c91fcac4 # v1
        with:
          user: ${{ github.event.pull_request.user.login }}
          allow-fail: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build:
    name: Build web preview
    needs: trust
    if: contains(fromJSON('["bot", "collaborator", "vouched"]'), needs.trust.outputs.status)
    runs-on: depot-ubuntu-24.04-16
    timeout-minutes: 10
    env:
      VITE_RELEASE_CHANNEL: preview
      VITE_HOSTED_APP_URL: https://preview-${{ github.event.pull_request.number }}.supaterm.com
    steps:
      - name: Checkout PR without credentials
        shell: bash
        env:
          CHECKOUT_REF: ${{ github.event.pull_request.head.sha }}
          GIT_TERMINAL_PROMPT: "0"
        run: |
          set -euo pipefail
          git init .
          git remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
          git fetch --no-tags --depth=1 origin "$CHECKOUT_REF"
          git checkout --detach FETCH_HEAD

      - name: Setup Mise
        uses: ./.github/actions/setup-mise
      - name: Install workspace dependencies
        run: mise exec -- vp install --filter=@supaterm/scripts... --filter=@supaterm/web...
      - name: Build preview
        run: vp run --filter @supaterm/web build
      - name: Upload static assets
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: web-assets
          path: apps/web/dist
          if-no-files-found: error
          retention-days: 1
