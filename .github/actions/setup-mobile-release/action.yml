name: Setup mobile release
description: Install mobile dependencies and load the release environment
inputs:
  token:
    description: Expo access token
    required: true
  environment:
    description: Expo environment
    required: true
runs:
  using: composite
  steps:
    - uses: ./.github/actions/setup-mise
    - shell: bash
      run: |
        mise exec -- pnpm config set virtualStoreType project --location project
        mise exec -- vp install --filter=@supaterm/mobile...
    - shell: bash
      run: mise exec -- pnpm --version
    - uses: expo/expo-github-action@eab7a230208c952974db8c3245cfd78402c7b385 # 9.0.0
      with:
        eas-version: 24.10.0
        token: ${{ inputs.token }}
        packager: npm
    - shell: bash
      working-directory: apps/mobile
      env:
        EXPO_TOKEN: ${{ inputs.token }}
        MOBILE_ENVIRONMENT: ${{ inputs.environment }}
      run: eas env:pull "$MOBILE_ENVIRONMENT" --non-interactive
