name: Setup macOS build deps
description: Install macOS build dependencies and restore build caches

inputs:
  cache-native-builds:
    description: Restore and save native dependency build caches
    required: true

runs:
  using: composite
  steps:
    - name: Select Xcode 26.3
      shell: bash
      run: |
        sudo xcode-select -s /Applications/Xcode_26.3.app/Contents/Developer
        xcodebuild -version
    - uses: jdx/mise-action@v4
      with:
        version: 2026.3.0
        cache: true
    - name: Authenticate with Tuist
      shell: bash
      run: |
        for attempt in 1 2 3; do
          if mise exec -- tuist auth login; then
            exit 0
          fi
          if [ "$attempt" = 3 ]; then
            exit 1
          fi
          sleep $((attempt * 10))
        done
    - name: Xcode cache key
      shell: bash
      run: |
        XCODE_VERSION="$(xcodebuild -version | tr '\n' '-' | sed 's/[^A-Za-z0-9._-]/_/g; s/-$//')"
        printf '%s\n' "XCODE_VERSION=$XCODE_VERSION" >> "$GITHUB_ENV"
    - name: Tuist version
      shell: bash
      run: |
        TUIST_VERSION="$(mise exec -- tuist version)"
        printf '%s\n' "TUIST_VERSION=$TUIST_VERSION" >> "$GITHUB_ENV"
    - name: Tuist package cache
      uses: actions/cache@v5
      with:
        path: |
          apps/mac/Tuist/.build/repositories
          apps/mac/Tuist/.build/checkouts
          apps/mac/Tuist/.build/artifacts
          apps/mac/Tuist/.build/prebuilts
          apps/mac/Tuist/.build/workspace-state.json
          apps/mac/Tuist/.build/Derived
        key: ${{ runner.os }}-${{ runner.arch }}-xcode-${{ env.XCODE_VERSION }}-tuist-${{ env.TUIST_VERSION }}-packages-v1-${{ hashFiles('apps/mac/Tuist/Package.swift', 'apps/mac/Tuist/Package.resolved') }}
    - name: Ghostty fingerprint
      if: ${{ inputs.cache-native-builds == 'true' }}
      shell: bash
      run: |
        GHOSTTY_FINGERPRINT="$(apps/mac/scripts/build-ghostty.sh --print-fingerprint)"
        printf '%s\n' "GHOSTTY_FINGERPRINT=$GHOSTTY_FINGERPRINT" >> "$GITHUB_ENV"
    - name: Ghostty cache
      if: ${{ inputs.cache-native-builds == 'true' }}
      uses: actions/cache@v5
      with:
        path: apps/mac/.build/ghostty
        key: ${{ runner.os }}-${{ runner.arch }}-xcode-${{ env.XCODE_VERSION }}-ghostty-v3-${{ env.GHOSTTY_FINGERPRINT }}
    - name: Zmx fingerprint
      if: ${{ inputs.cache-native-builds == 'true' }}
      shell: bash
      run: |
        ZMX_FINGERPRINT="$(apps/mac/scripts/build-zmx.sh --print-fingerprint)"
        printf '%s\n' "ZMX_FINGERPRINT=$ZMX_FINGERPRINT" >> "$GITHUB_ENV"
    - name: Zmx cache
      if: ${{ inputs.cache-native-builds == 'true' }}
      uses: actions/cache@v5
      with:
        path: apps/mac/.build/zmx
        key: ${{ runner.os }}-${{ runner.arch }}-xcode-${{ env.XCODE_VERSION }}-zmx-v2-${{ env.ZMX_FINGERPRINT }}
    - name: Ap fingerprint
      if: ${{ inputs.cache-native-builds == 'true' }}
      shell: bash
      run: |
        AP_FINGERPRINT="$(apps/mac/scripts/build-ap.sh --print-fingerprint)"
        printf '%s\n' "AP_FINGERPRINT=$AP_FINGERPRINT" >> "$GITHUB_ENV"
    - name: Ap cache
      if: ${{ inputs.cache-native-builds == 'true' }}
      uses: actions/cache@v5
      with:
        path: apps/mac/.build/ap
        key: ${{ runner.os }}-${{ runner.arch }}-xcode-${{ env.XCODE_VERSION }}-ap-v2-${{ env.AP_FINGERPRINT }}
