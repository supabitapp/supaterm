name: Setup macOS build deps
description: Install macOS build dependencies and restore build caches

inputs:
  cache-native-builds:
    description: Restore and save native dependency build caches
    required: true
  cache-tuist-packages:
    description: Restore and save Tuist package dependencies
    required: false
    default: "true"
  github-token:
    description: Authenticate mise downloads
    required: true

runs:
  using: composite
  steps:
    - name: Select pinned Xcode
      shell: bash
      run: |
        XCODE_VERSION="$(tr -d '[:space:]' < .xcode-version)"
        XCODE_BUILD_VERSION="$(tr -d '[:space:]' < .xcode-build-version)"
        XCODE_PATH="/Applications/Xcode_${XCODE_VERSION}.app/Contents/Developer"
        test -d "$XCODE_PATH" || {
          echo "::error::Pinned Xcode $XCODE_VERSION is not installed at $XCODE_PATH"
          exit 1
        }
        sudo xcode-select -s "$XCODE_PATH"
        xcodebuild -version
        test "$(xcodebuild -version | awk 'NR == 2 { print $3 }')" = "$XCODE_BUILD_VERSION" || {
          echo "::error::Pinned Xcode $XCODE_VERSION must have build $XCODE_BUILD_VERSION"
          exit 1
        }
    - uses: ./.github/actions/setup-mise
      with:
        github-token: ${{ inputs.github-token }}
    - name: Toolchain fingerprint for dependency caches
      if: ${{ inputs.cache-tuist-packages == 'true' || inputs.cache-native-builds == 'true' }}
      shell: bash
      run: |
        XCODE_VERSION="$(xcodebuild -version | tr '\n' '-' | sed 's/[^A-Za-z0-9._-]/_/g; s/-$//')"
        printf '%s\n' "XCODE_VERSION=$XCODE_VERSION" >> "$GITHUB_ENV"
    - name: Tuist version
      if: ${{ inputs.cache-tuist-packages == 'true' }}
      shell: bash
      run: |
        TUIST_VERSION="$(mise exec -- tuist version)"
        printf '%s\n' "TUIST_VERSION=$TUIST_VERSION" >> "$GITHUB_ENV"
    - name: Tuist package cache
      id: tuist-package-cache
      if: ${{ inputs.cache-tuist-packages == 'true' }}
      uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25
      with:
        path: |
          apps/.build/.tuist-installed
          apps/Tuist/.build/repositories
          apps/Tuist/.build/checkouts
          apps/Tuist/.build/artifacts
          apps/Tuist/.build/prebuilts
          apps/Tuist/.build/workspace-state.json
          apps/Tuist/.build/Derived
        key: ${{ runner.os }}-${{ runner.arch }}-xcode-${{ env.XCODE_VERSION }}-tuist-${{ env.TUIST_VERSION }}-packages-v2-${{ hashFiles('mise.toml', 'apps/Tuist.mk', 'apps/Tuist.swift', 'apps/Tuist/Package.swift', 'apps/Tuist/Package.resolved') }}
        restore-keys: ${{ runner.os }}-${{ runner.arch }}-xcode-${{ env.XCODE_VERSION }}-tuist-${{ env.TUIST_VERSION }}-packages-v1-${{ hashFiles('apps/Tuist/Package.swift', 'apps/Tuist/Package.resolved') }}
    - name: Refresh Tuist install stamp
      if: ${{ inputs.cache-tuist-packages == 'true' && steps.tuist-package-cache.outputs.cache-hit == 'true' }}
      shell: bash
      run: touch apps/.build/.tuist-installed
    - name: Ghostty fingerprint
      if: ${{ inputs.cache-native-builds == 'true' }}
      shell: bash
      run: |
        GHOSTTY_FINGERPRINT="$(apps/mac/scripts/build-ghostty.sh --print-fingerprint)"
        printf '%s\n' "GHOSTTY_FINGERPRINT=$GHOSTTY_FINGERPRINT" >> "$GITHUB_ENV"
    - name: Ghostty cache
      if: ${{ inputs.cache-native-builds == 'true' }}
      uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25
      with:
        path: apps/mac/.build/ghostty
        key: ${{ runner.os }}-${{ runner.arch }}-xcode-${{ env.XCODE_VERSION }}-ghostty-v3-${{ env.GHOSTTY_FINGERPRINT }}
    - name: Zmx fingerprint
      if: ${{ inputs.cache-native-builds == 'true' }}
      shell: bash
      run: |
        ZMX_FINGERPRINT="$(apps/mac/scripts/build-zmx.sh --print-fingerprint)"
        printf '%s\n' "ZMX_FINGERPRINT=$ZMX_FINGERPRINT" >> "$GITHUB_ENV"
    - name: Zmx cache
      if: ${{ inputs.cache-native-builds == 'true' }}
      uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25
      with:
        path: apps/mac/.build/zmx
        key: ${{ runner.os }}-${{ runner.arch }}-xcode-${{ env.XCODE_VERSION }}-zmx-v2-${{ env.ZMX_FINGERPRINT }}
    - name: Ap fingerprint
      if: ${{ inputs.cache-native-builds == 'true' }}
      shell: bash
      run: |
        AP_FINGERPRINT="$(apps/mac/scripts/build-ap.sh --print-fingerprint)"
        printf '%s\n' "AP_FINGERPRINT=$AP_FINGERPRINT" >> "$GITHUB_ENV"
    - name: Ap cache
      if: ${{ inputs.cache-native-builds == 'true' }}
      uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25
      with:
        path: apps/mac/.build/ap
        key: ${{ runner.os }}-${{ runner.arch }}-xcode-${{ env.XCODE_VERSION }}-ap-v2-${{ env.AP_FINGERPRINT }}
