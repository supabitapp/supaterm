name: Resolve preview
description: Verify a completed PR build and author trust before publishing its artifact
inputs:
  artifact-name:
    description: Artifact produced by the preview build
    required: true
  preview-label:
    description: Optional manual rebuild label to consume
    required: true
outputs:
  eligible:
    description: Whether the artifact may be published
    value: ${{ steps.gate.outputs.eligible }}
  pr_number:
    description: Open pull request owning the build
    value: ${{ steps.pr.outputs.pr_number }}
  head_sha:
    description: Current PR head matching the build
    value: ${{ steps.pr.outputs.head_sha }}
  artifact_id:
    description: Validated artifact selection for this build
    value: ${{ steps.pr.outputs.artifact_id }}
runs:
  using: composite
  steps:
    - id: pr
      name: Resolve the pull request behind the build
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
      env:
        PREVIEW_ARTIFACT_NAME: ${{ inputs.artifact-name }}
      with:
        script: |
          const run = context.payload.workflow_run;
          const { owner, repo } = context.repo;

          // The build workflow also completes (with every job skipped) for
          // label events that are not the preview label. Only a run that
          // produced a bundle is worth resolving.
          const artifacts = await github.paginate(github.rest.actions.listWorkflowRunArtifacts, {
            owner,
            repo,
            run_id: run.id,
            per_page: 100,
          });
          const bundles = artifacts.filter((artifact) => artifact.name === process.env.PREVIEW_ARTIFACT_NAME && !artifact.expired);
          if (bundles.length !== 1) {
            core.info(`Expected one ${process.env.PREVIEW_ARTIFACT_NAME} artifact; found ${bundles.length}. Skipping.`);
            core.setOutput("eligible", "false");
            return;
          }

          const open = await github.paginate(github.rest.pulls.list, {
            owner,
            repo,
            state: "open",
            head: `${run.head_repository?.owner?.login}:${run.head_branch}`,
            per_page: 100,
          });
          const matching = open.filter(
            (candidate) =>
              candidate.state === "open" &&
              candidate.head.sha === run.head_sha &&
              candidate.head.ref === run.head_branch &&
              candidate.head.repo?.full_name === run.head_repository?.full_name,
          );
          if (matching.length !== 1) {
            core.info(`Expected one open PR for ${run.head_sha}; found ${matching.length}. Skipping.`);
            core.setOutput("eligible", "false");
            return;
          }
          const { data: pull } = await github.rest.pulls.get({
            owner,
            repo,
            pull_number: matching[0].number,
          });

          if (pull.state !== "open") {
            core.info(`PR #${pull.number} is not open. Skipping.`);
            core.setOutput("eligible", "false");
            return;
          }
          if (pull.head.sha !== run.head_sha) {
            core.info(`PR #${pull.number} moved to ${pull.head.sha} after ${run.head_sha} was built. Skipping.`);
            core.setOutput("eligible", "false");
            return;
          }

          core.setOutput("artifact_id", String(bundles[0].id));
          core.setOutput("eligible", "true");
          core.setOutput("pr_number", String(pull.number));
          core.setOutput("head_sha", pull.head.sha);
          core.setOutput("author", pull.user.login);

    # Reads VOUCHED.td from the default branch through the API, so a PR
    # cannot vouch for itself.
    - id: vouch
      name: Check PR author trust
      if: steps.pr.outputs.eligible == 'true'
      uses: mitchellh/vouch/action/check-user@d66fa29a64600490892131ad87597c30c91fcac4 # v1
      with:
        user: ${{ steps.pr.outputs.author }}
        allow-fail: true
      env:
        GITHUB_TOKEN: ${{ github.token }}

    - id: gate
      name: Decide eligibility
      shell: bash
      env:
        PR_ELIGIBLE: ${{ steps.pr.outputs.eligible }}
        VOUCH_STATUS: ${{ steps.vouch.outputs.status }}
        AUTHOR: ${{ steps.pr.outputs.author }}
      run: |
        set -euo pipefail
        if [[ "$PR_ELIGIBLE" != "true" ]]; then
          echo "eligible=false" >> "$GITHUB_OUTPUT"
          exit 0
        fi
        case "$VOUCH_STATUS" in
          bot|collaborator|vouched)
            echo "Author $AUTHOR is trusted ($VOUCH_STATUS)."
            echo "eligible=true" >> "$GITHUB_OUTPUT"
            ;;
          *)
            echo "Author $AUTHOR is not vouched ($VOUCH_STATUS). Add them to .github/VOUCHED.td to allow previews."
            echo "eligible=false" >> "$GITHUB_OUTPUT"
            ;;
        esac

    # Consume an optional manual request so the label can trigger another
    # rebuild later. Its absence does not affect automatic previews.
    - id: consume
      name: Consume the preview label
      if: steps.gate.outputs.eligible == 'true'
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
      env:
        PR_NUMBER: ${{ steps.pr.outputs.pr_number }}
        PREVIEW_LABEL: ${{ inputs.preview-label }}
      with:
        script: |
          try {
            await github.rest.issues.removeLabel({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: Number(process.env.PR_NUMBER),
              name: process.env.PREVIEW_LABEL,
            });
          } catch (error) {
            if (error.status !== 404) throw error;
            core.info("No manual preview request to consume; automatic preview continues.");
          }
