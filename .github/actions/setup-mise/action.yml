name: Setup mise
description: Install mise and restore its tools

inputs:
  github-token:
    description: Authenticate GitHub downloads
    required: true
  install:
    description: Install configured tools
    required: false
    default: "true"

runs:
  using: composite
  steps:
    - name: Resolve release
      id: release
      shell: bash
      run: |
        version=2026.8.5
        case "$RUNNER_OS-$RUNNER_ARCH" in
          Linux-X64)
            platform=linux-x64
            checksum=79bbb282ceff89c225b6f05801b6f6c1b8bd957a600be798f155985461fd5fbe
            ;;
          macOS-ARM64)
            platform=macos-arm64
            checksum=ad67e38aeccc13ed0ddec0d0cb9928adde63e564c4e27960fa18119ee84c41f0
            ;;
          *)
            echo "::error::Unsupported runner $RUNNER_OS-$RUNNER_ARCH"
            exit 1
            ;;
        esac
        printf '%s\n' "version=$version" >> "$GITHUB_OUTPUT"
        printf '%s\n' "platform=$platform" >> "$GITHUB_OUTPUT"
        printf '%s\n' "checksum=$checksum" >> "$GITHUB_OUTPUT"
        printf '%s\n' "image=${ImageOS:-self-hosted}" >> "$GITHUB_OUTPUT"
    - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25
      with:
        path: |
          ~/.cache/mise
          ~/.local/share/mise
          ~/.local/state/mise
        key: mise-v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.release.outputs.image }}-${{ steps.release.outputs.version }}-${{ hashFiles('mise.toml') }}
    - name: Install mise
      shell: bash
      env:
        MISE_GITHUB_TOKEN: ${{ inputs.github-token }}
        MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}
        MISE_YES: "1"
      run: |
        mise_dir="${MISE_DATA_DIR:-$HOME/.local/share/mise}"
        mise_bin="$mise_dir/bin/mise"
        if [ ! -x "$mise_bin" ]; then
          archive_name="mise-v${{ steps.release.outputs.version }}-${{ steps.release.outputs.platform }}.tar.xz"
          archive_path="$RUNNER_TEMP/$archive_name"
          curl --fail --location --silent --show-error --retry 5 --retry-all-errors \
            -H "Authorization: Bearer $MISE_GITHUB_TOKEN" \
            "https://github.com/jdx/mise/releases/download/v${{ steps.release.outputs.version }}/$archive_name" \
            -o "$archive_path"
          printf '%s  %s\n' "${{ steps.release.outputs.checksum }}" "$archive_path" | shasum -a 256 -c -
          mkdir -p "$mise_dir"
          tar -xJf "$archive_path" --strip-components=1 -C "$mise_dir"
        fi

        printf '%s\n' "$mise_dir/bin" >> "$GITHUB_PATH"
        export PATH="$mise_dir/bin:$PATH"
        printf '%s\n' "MISE_TRUSTED_CONFIG_PATHS=$MISE_TRUSTED_CONFIG_PATHS" >> "$GITHUB_ENV"
        printf '%s\n' "MISE_YES=$MISE_YES" >> "$GITHUB_ENV"
        "$mise_bin" --version

        if [ "${{ inputs.install }}" = true ]; then
          "$mise_bin" install
        fi

        mise_env="$("$mise_bin" env --json)"
        jq -r 'to_entries[] | select(.key != "PATH") | "\(.key)=\(.value)"' <<< "$mise_env" >> "$GITHUB_ENV"
        jq -r '.PATH | split(":")[]' <<< "$mise_env" >> "$GITHUB_PATH"
