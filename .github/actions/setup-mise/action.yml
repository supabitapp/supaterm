name: Setup Mise
description: Install the project runtime tools through Mise
inputs:
  cache:
    description: Restore and save the Mise tool cache. Jobs that publish or hold secrets turn it off.
    default: "true"
runs:
  using: composite
  steps:
    - uses: jdx/mise-action@08ae2a091c038e1e05ec6f5115dc5c69d5a2a6b8
      with:
        cache: ${{ inputs.cache }}
        install_args: --locked node pnpm github:voidzero-dev/vite-plus hk
