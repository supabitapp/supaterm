name: Setup Mise
description: Install the project runtime tools through Mise
inputs:
  cache:
    description: Restore and save the Mise tool cache. Jobs that publish or hold secrets turn it off, because any branch can write the cache on Depot runners.
    default: "true"
runs:
  using: composite
  steps:
    - uses: jdx/mise-action@6612f0ef07ed2a736cd1e00a94a065522dd41195
      with:
        cache: ${{ inputs.cache }}
        install_args: --locked node pnpm github:voidzero-dev/vite-plus hk
