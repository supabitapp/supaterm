name: Build mobile
description: Compile and sign a mobile binary on the current runner
inputs:
  platform:
    description: Native platform
    required: true
  profile:
    description: Build profile from eas.json
    required: true
outputs:
  binary:
    description: Path to the signed binary
    value: ${{ steps.build.outputs.binary }}
  fingerprint:
    description: Fingerprint embedded in the signed binary
    value: ${{ steps.build.outputs.fingerprint }}
runs:
  using: composite
  steps:
    - uses: actions/setup-java@v5
      if: inputs.platform == 'android'
      with:
        distribution: temurin
        java-version: 17
    - uses: android-actions/setup-android@v4
      if: inputs.platform == 'android'
    - shell: bash
      if: inputs.platform == 'ios'
      env:
        DEVELOPER_DIR: /Applications/Xcode_27.1.app/Contents/Developer
      run: |
        xcodebuild -version
        xcrun --find actool
        echo "DEVELOPER_DIR=$DEVELOPER_DIR" >> "$GITHUB_ENV"
        command -v fastlane || brew install fastlane
        command -v pod || brew install cocoapods
    - id: build
      shell: bash
      working-directory: apps/mobile
      env:
        MOBILE_PLATFORM: ${{ inputs.platform }}
        MOBILE_PROFILE: ${{ inputs.profile }}
      run: |
        extension=ipa
        if [ "$MOBILE_PLATFORM" = android ]; then
          extension=aab
          if [ "$MOBILE_PROFILE" = preview:dev ]; then
            extension=apk
          fi
        fi
        binary="$RUNNER_TEMP/supaterm-$MOBILE_PLATFORM.$extension"
        eas build --local --platform "$MOBILE_PLATFORM" --profile "$MOBILE_PROFILE" \
          --non-interactive --freeze-credentials --output "$binary"
        fingerprint=$(node ../../.github/scripts/mobile-build-fingerprint.cjs "$binary" "$MOBILE_PLATFORM")
        echo "binary=$binary" >> "$GITHUB_OUTPUT"
        echo "fingerprint=$fingerprint" >> "$GITHUB_OUTPUT"
