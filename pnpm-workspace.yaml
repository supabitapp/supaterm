  - expo-dev-menu@58.0.10
  - expo-image-manipulator@58.0.14
  - expo-image-picker@58.0.10
  - expo-image@58.0.15
  - expo-linking@58.0.13
  - expo-modules-autolinking@58.0.7
  - expo-modules-core@58.0.11 || 58.0.19 || 58.0.22
  - expo-modules-jsi@58.0.7 || 58.0.14 || 58.0.15
  - expo-sharing@58.0.19
  - expo-sqlite@58.0.13
