packages:
  - apps/*
  - oxlint-plugin-supaterm
  - packages/*
  - scripts

# Reuse installed dependency graphs across worktrees on the same machine.
virtualStoreType: global

# Successor to onlyBuiltDependencies/ignoredBuiltDependencies (pnpm 11+).
# true = allowed to run build scripts; false mirrors the pnpm 10 behavior
# where anything outside onlyBuiltDependencies was silently not built.
allowBuilds:
  bufferutil: false
  # No install script since Electron 44; ensure:electron runs install.js.
  # Keep the key: pnpm fails installs that still record a removed `true`.
  electron: false
  electron-winstaller: false
  esbuild: true
  msgpackr-extract: true
  msw: false
  # Ships N-API prebuilds; the install script would only fall back to node-gyp.
  node-hid: false
  node-pty: true
  "react-native-enriched-markdown@file:apps/mobile/deps/react-native-enriched-markdown-1.2.0-supacode.16.tgz": true
  sharp: true
  "@tsc-rs/typescript": true
  utf-8-validate: false

catalog:
  "@effect/atom-react": 4.0.5
  "@effect/graphql-generator": 4.0.5
  "@effect/openapi-generator": 4.0.5
  "@effect/platform-node": 4.0.5
  "@effect/platform-node-shared": 4.0.5
  "@effect/vitest": 4.0.5
  "@legendapp/list": 3.3.5
  "@noble/hashes": 1.8.0
  "@pierre/diffs": 1.6.1
  "@tailwindcss/node": 4.3.3
  "@tailwindcss/oxide": 4.3.3
  "@tailwindcss/vite": 4.3.3
  "@types/node": 24.12.4
  "@types/react": ~19.3.0
  "@types/react-dom": ~19.3.0
  "@types/ws": 8.18.2
  effect: 4.0.5
  jose: 6.2.12
  lightningcss: 1.33.0
  react: 19.3.0
  react-dom: 19.3.0
  tailwindcss: 4.3.3
  typescript: npm:@tsc-rs/typescript@0.8.0
  undici: 8.12.3
  vite: npm:@voidzero-dev/vite-plus-core@1.3.0
  vite-plus: 1.3.0
  yaml: ^2.9.0
  # Markdown pipeline: the server counts find matches with the same parser the
  # web renders with, so both must resolve to one version.
  mdast-util-directive: 3.1.0
  micromark-extension-directive: 4.0.0
  micromark-util-character: 2.1.1
  micromark-util-types: 2.0.2
  rehype-raw: 7.0.0
  rehype-sanitize: 6.0.0
  remark-breaks: 4.0.0
  remark-gfm: 4.0.1
  remark-parse: 11.0.0
  remark-rehype: 11.1.2
  unified: 11.0.5

minimumReleaseAgeExclude:
