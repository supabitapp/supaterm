[package]
name = "supaterm-host"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"

[lib]
name = "supaterm_host"

[[bin]]
name = "supaterm-host"
path = "src/bin/supaterm-host.rs"

[[bin]]
name = "sp"
path = "src/bin/sp.rs"

[dependencies]
bytes = "1.10"
getrandom = "0.3"
libc = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
thiserror = "2.0"
tokio = { version = "1.47", features = ["io-std", "io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }

[dev-dependencies]
tokio = { version = "1.47", features = ["process"] }
