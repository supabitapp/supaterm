[package]
name = "supaterm-tui"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
publish = false
license = "Elastic-2.0"

[[bin]]
name = "supaterm"
path = "src/main.rs"

[dependencies]
crossterm = "0.29.0"
image = { version = "0.25.9", default-features = false, features = ["gif", "jpeg", "png", "webp"] }
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm"] }
shell-words = "1.1.1"
terminal-colorsaurus = "1.0.3"
unicode-segmentation = "1.13.3"
unicode-width = "0.2.2"

[dev-dependencies]
tempfile = "3.27.0"
