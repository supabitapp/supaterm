id = "codex"
version = "2026.08.20.3"
min_engine_version = 3
updated_at = "2026-08-20T00:00:00Z"

[[rules]]
id = "osc_title_blocked"
state = "blocked"
priority = 1100
region = "osc_title"
visible_blocker = true
contains = ["Action Required"]

[[rules]]
id = "osc_title_working"
state = "working"
priority = 1050
region = "osc_title"
visible_working = true
regex = ['(?:^| )[⠋⠙⠹⠸⠼⠴⠦⠧⠇⠏](?: |$)']

[[rules]]
id = "transcript_viewer"
state = "unknown"
priority = 1000
region = "after_last_prompt_marker"
skip_state_update = true
contains = ["↑/↓ to scroll", "pgup/pgdn to", "home/end to jump", "q to quit"]
any = [
  { contains = ["esc to edit prev"] },
  { contains = ["esc/← to edit prev"] },
]

# The welcome logo can sit above the prompt, so the marker line is not anchored to the top.
[[rules]]
id = "trust_directory"
state = "blocked"
priority = 950
region = "top_non_empty_lines(30)"
visible_blocker = true
all = [
  { regex = ['(?m)^> You are in [^\r\n]+$'] },
  { regex = ['(?s)Do\s+you\s+trust\s+the\s+contents\s+of\s+this\s+directory\?'] },
]

[[rules]]
id = "live_strong_blocker"
state = "blocked"
priority = 900
region = "after_last_prompt_marker"
visible_blocker = true
any = [
  { contains = ["press enter to confirm or esc to cancel"] },
  { contains = ["enter to submit answer"] },
  { contains = ["enter to submit all"] },
  { contains = ["allow command?"] },
]

[[rules]]
id = "weak_blocker"
state = "blocked"
priority = 600
region = "whole_recent"
any = [
  { contains = ["[y/n]"] },
  { contains = ["yes (y)"] },
  { contains = ["do you want to"], any = [{ contains = ["yes"] }, { contains = ["❯"] }] },
  { contains = ["would you like to"], any = [{ contains = ["yes"] }, { contains = ["❯"] }] },
]

# The header can be any text, the bullet vanishes without animations, and the
# interrupt key is remappable, so anchor on the elapsed+interrupt suffix instead.
[[rules]]
id = "screen_working_fallback"
state = "working"
priority = 500
region = "bottom_non_empty_lines(8)"
visible_working = true
line_regex = ['^[•◦]?\s*\S.*\((?:(?:\d+h )?(?:\d+m )?\d+s [•·] [^)]+ to interrupt\)(?: · .*)?|[^)]*…)$']
not = [{ contains = ["■ Conversation interrupted"] }]

# Streaming answers hide the status row; a pending-steer preview still means running.
[[rules]]
id = "queued_messages_working"
state = "working"
priority = 450
region = "bottom_non_empty_lines(8)"
visible_working = true
contains = ["to interrupt and send immediately"]
not = [{ contains = ["■ Conversation interrupted"] }]

[[rules]]
id = "osc_title_idle"
state = "idle"
priority = 100
region = "osc_title"
visible_idle = true
regex = ['\S']
not = [
  { regex = ['(?:^| )[⠋⠙⠹⠸⠼⠴⠦⠧⠇⠏](?: |$)'] },
  { contains = ["Action Required"] },
]
