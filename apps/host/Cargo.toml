[package]
name = "supaterm-host"
version = "0.0.0"
edition = "2024"
rust-version = "1.97"

[dependencies]
anyhow = "1.0"
base64 = "0.22"
clap = { version = "4.5", features = ["derive"] }
libc = "0.2"
portable-pty = "=0.9.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tokio = { version = "1.52", features = ["io-std", "io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
uuid = { version = "1.20", features = ["serde", "v4"] }

[dev-dependencies]
tempfile = "3.27"

[lib]
name = "supaterm_host"
path = "src/lib.rs"

[[bin]]
name = "supaterm-host"
path = "src/main.rs"
