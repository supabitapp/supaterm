min_version = "2026.9.7"

[tool_config]
locked = true

[tools]
node = "24.22.1"
pnpm = "12.10.1"
"github:voidzero-dev/vite-plus" = "1.3.0"
gitleaks = "8.30.1"
hk = { version = "2.7.0", os = ["linux", "windows", "macos/arm64"] }
"github:jdx/jactionlint" = "2.2.0"
shellcheck = "0.11.0"

[env]
HK_CONFIG_DIR = "{{config_root}}/.hk-config"

[tasks."hooks:install"]
run = """
vp config --no-hooks --no-agent
vp hooks disable
hk install --force-local --mise
"""
run_windows = "vp config --no-hooks --no-agent && vp hooks disable && hk install --force-local --mise"
