[tools]
hk = "1.52.0"
pkl = "0.31.1"
zig = "0.16.0"
rust = { version = "1.95.0", components = ["clippy", "rustfmt"] }
tuist = "4.203.1"
swiftlint = "0.63.2"
xcbeautify = "3.2.1"
pnpm = "10.32.1"
"pipx:dmgbuild" = { version = "1.6.7", os = ["macos"] }
periphery = { version = "3.7.4", os = ["macos"] }
fnox = "latest"

[env]
HK_MISE = "1"

[hooks]
postinstall = '''
set -e
command -v vp >/dev/null 2>&1 || curl -fsSL https://vite.plus | bash
make install-git-hooks
'''
