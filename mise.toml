[tools]
hk = "1.55.0"
zig = "0.16.0"
rust = "1.97.1"
tuist = "4.204.0-canary.6"
swiftlint = "0.65.0"
xcbeautify = "3.2.1"
pnpm = "10.32.1"
"pipx:dmgbuild" = { version = "1.6.7", os = ["macos"] }
periphery = { version = "3.8.0", os = ["macos"] }
fnox = "latest"

[env]
HK_MISE = "1"
TUIST_XCODE_CACHE = "{{ exec(command='test -S ~/.local/state/tuist/supabitapp_supaterm.sock && /usr/sbin/lsof ~/.local/state/tuist/supabitapp_supaterm.sock >/dev/null 2>&1 && printf 1 || printf 0') }}"

[hooks]
postinstall = '''
set -e
command -v vp >/dev/null 2>&1 || curl -fsSL https://vite.plus | bash
make install-git-hooks
'''
